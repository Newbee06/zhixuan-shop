function isValidAppIconKey(k){ return /^[A-Za-z0-9_-]{1,64}$/.test(String(k || '')); }

// 统一 API：网络失败 / 非 JSON / 未授权 / 超时 / 业务错误一律转成 {ok:false, error}，调用方不用再 try/catch JSON 解析。
async function api(p, m, b){
  var ctrl = null, timer = null;
  try {
    if (typeof AbortController !== 'undefined') { ctrl = new AbortController(); timer = setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, 30000); }
    var res = await fetch(p, { method: m || 'GET', headers: {'content-type': 'application/json'}, body: b ? JSON.stringify(b) : undefined, signal: ctrl ? ctrl.signal : undefined });
    if (timer) clearTimeout(timer);
    var text = '';
    try { text = await res.text(); } catch (e) { return { ok: false, error: '网络异常，请检查网络后重试', _http: res.status }; }
    var j = null;
    try { j = JSON.parse(text); } catch (e) { return { ok: false, error: '服务器返回异常（非 JSON），状态 ' + res.status, _http: res.status }; }
    if (res.status === 401) {
      // P3-22：管理端会话过期/撤销时及时显登录界面（不含登录/自检接口自身，避免递归）。
      // 403 不走此分支：权限不足/需改密由调用方按文案提示，不当作未登录。
      if (p.indexOf('/api/admin/') === 0 && p.indexOf('/api/admin/login') !== 0 && p.indexOf('/api/admin/me') !== 0 && typeof location !== 'undefined' && location.hash === '#/admin' && !window._adminUnauthRedirecting) {
        window._adminUnauthRedirecting = true;
        setTimeout(function(){ window._adminUnauthRedirecting = false; try { renderAdmin(); } catch (e) {} }, 0);
      }
      return { ok: false, error: (j && j.error) || '未登录或凭证已过期', _http: 401, _unauth: true };
    }
    if (!res.ok && j && j.ok === undefined) return { ok: false, error: j.error || ('请求失败，状态 ' + res.status), _http: res.status };
    return j;
  } catch (e) {
    if (timer) clearTimeout(timer);
    if (e && e.name === 'AbortError') return { ok: false, error: '请求超时，请重试' };
    return { ok: false, error: '网络异常，请检查网络后重试' };
  }
}
function copyText(t){
  function done(){ toast('已复制', 'success'); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done).catch(function(){ fallbackCopy(t); }); return; }
  fallbackCopy(t);
  function fallbackCopy(v){ var ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制', 'error'); } ta.remove(); }
}
// 复制按钮统一走事件委托：按钮只带 data-copy-target="元素 id"（或 data-captcha-for="订单号" 刷新验证码），
// 不再在 onclick 里拼 id / 拼内容，避免引号逃逸与注入。
if (!window._copyDelegated) { window._copyDelegated = true; document.addEventListener('click', function(e){ var b = e.target && e.target.closest ? e.target.closest('[data-copy-target],[data-captcha-for]') : null; if (!b) return; var copyId = b.getAttribute('data-copy-target'); if (copyId) { var t = document.getElementById(copyId); if (t) copyText(t.textContent); return; } var capFor = b.getAttribute('data-captcha-for'); if (capFor) loadPayCaptchaFor(capFor); }); }
// ---- Toast / Modal / Drawer（统一交互，替代原生 alert/confirm/prompt） ----
function toast(msg, type){
  var wrap = el('toastWrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toastWrap'; wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){ try { t.remove(); } catch (e) {} }, type === 'error' ? 4200 : 2800);
}
function showModal(opts){
  // opts: {title, bodyHTML, confirmText, cancelText, danger, onConfirm, onCancel, showInput, inputLabel, inputPlaceholder, inputValue, fullBleed}
  // fullBleed: 移动端去掉弹窗左右内边距，表单输入框撑满弹窗宽度、与弹窗边缘对齐（用于商品编辑表单）。

  var bd = document.createElement('div');

async function doRecoverPayment(){

  var r = await api('/api/orders/query', 'POST', { keywords: no, captcha_id: window._recoverCaptchaId || '', captcha_code: capCode });
  loadRecoverCaptcha();
  if (!r.ok){ if (box) box.innerHTML = '<div class="muted">' + escH(r.error) + '</div>'; else toast(r.error, 'error'); return; }

  for (var i = 0; i < (r.orders || []).length; i++){ if (String((r.orders[i] || {}).order_no) === String(no)) { found = r.orders[i]; break; } }
  if (!found) found = (r.orders || [])[0] || null;
  if (!found){ if (box) box.innerHTML = '<div class="muted">未找到该订单，请检查订单号。</div>'; return; }
  if (found.status !== 'pending_payment'){ if (box) box.innerHTML = '<div class="muted">该订单当前状态为“' + escH(statusLabel(found.status)) + '”，不再需要付款。</div>'; return; }
  if (!found.pay_address){ if (box) box.innerHTML = '<div class="muted">该订单的收款地址暂无法恢复，请联系客服提供收款地址（请勿重复下单）。</div>'; return; }
  window._lastOrder = { order_no: found.order_no, total_usdt: found.total_usdt, actual_amount: found.actual_amount != null ? found.actual_amount : found.total_usdt, pay_address: found.pay_address, wallet_address: found.pay_address, expires_at: found.expires_at || '', pay_method: found.pay_method, pay_chain: found.pay_chain, has_query_password: 1 };
  renderSuccess(found.order_no);
}
async function submitTxid(no){
  var scope = 'pay-' + no;
  var txEl = el('txid') || el('qtxid-' + no) || el('qtxid');
  // P3-18：提交最前面规范化——去首尾空白后再长度与格式校验，载荷用规范化串。
  var tx = txEl ? txEl.value.trim() : '';
  if (!tx){ toast('请先填写 TXID（不填可直接等待自动发货）', 'error'); return; }
  if (tx.length < 6 || tx.length > 200){ toast('TXID 长度无效（6-200字符）', 'error'); return; }
  if (!/^[A-Za-z0-9_-]+$/.test(tx)){ toast('TXID 仅支持字母数字 _ -', 'error'); return; }
  var body = { txid: tx };
  // P1-3：TXID 区同样按 turnstile_enabled 分支——本次订单 Widget 的 Token，绝不把 A 的 Token 用在 B。
  if (tsFailClosed()){ toast('反机器人验证未配置（Site Key 缺失），请联系管理员', 'error'); return; }
  if (tsEnabled()) {
    var tok = tsToken(scope);
    if (!tok){ toast('请完成反机器人验证', 'error'); return; }
    body.turnstile_token = tok;
  } else {
    // P3-4：/pay 提交 TXID 带图形验证码，字段名与下单验证码一致（captcha_id / captcha_code）。
    // 验证码单次有效，/pay 用独立的新验证码，不复用查单验证码。
    var capInput = el('payCaptchaCode-' + no) || el('payCaptchaCode');
    if (capInput) {
      var capCode = capInput.value.trim();
      if (!capCode){ toast('请填写图形验证码', 'error'); return; }
      body.captcha_id = (window._payCaptchaIds && window._payCaptchaIds[no]) || window._payCaptchaId || '';
      body.captcha_code = capCode;
    }
  }
  var r = await api('/api/orders/' + encodeURIComponent(no) + '/pay', 'POST', body);
  if (!r.ok){
    toast(r.error, 'error');
    if ((r.error || '').indexOf('验证码') !== -1) { if (el('payCaptchaCode-' + no)) loadPayCaptchaFor(no); else loadPayCaptcha(); }
    // P2-9：失败清 Token（网络异常/超时除外：请求未到服务端，Token 未被消费，可保留重用）。
    if (!/网络异常|请求超时/.test(r.error || '')) resetTurnstile(scope);
    return;
  }
  // P2-8：成功后清空 TXID 输入 + 清已消费验证码并加载新验证码（各订单刷新自己的）；Turnstile 走 Token 重置。
  if (txEl) txEl.value = '';
  var capAfter = el('payCaptchaCode-' + no) || el('payCaptchaCode');
  if (capAfter) { capAfter.value = ''; if (el('payCaptchaCode-' + no)) loadPayCaptchaFor(no); else loadPayCaptcha(); }
  resetTurnstile(scope);
  toast(r.message || 'TXID 已提交', 'success');
}

function handleProductImage(file, pfx){
  if (!file) return;
  if (file.type.indexOf('image/') !== 0){ toast('请选择图片文件', 'error'); return; }
  if (file.size > 2 * 1024 * 1024){ toast('图片不能超过 2MB', 'error'); return; }
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      var cv = document.createElement('canvas'); cv.width = 800; cv.height = 800;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, 800, 800);
      var url = cv.toDataURL('image/jpeg', 0.82);
      if (url.length > 700000) url = cv.toDataURL('image/jpeg', 0.6);
      if (url.length > 700000){ toast('图片压缩后仍超过 500KB，请换一张更小的图', 'error'); return; }
      window._productImage = window._productImage || {};
      window._productImage[pfx] = url;
      window._productImgMode = window._productImgMode || {};
      window._productImgMode[pfx] = 'upload';
      var pv = el(pfx + 'imgpv');
      if (pv) pv.innerHTML = '<img src="' + url + '" style="width:120px;height:120px;object-fit:cover;border-radius:16px">';
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

  var markup = Number(sv.upstream_markup || 1.2) || 1.2;
  var fixed = Number(sv.upstream_fixed || 0) || 0;
  var h = '';
  if (!filtered.length) h = '<div class="adm-empty">暂无符合条件的上游商品</div>';
  else {
    h = '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th><input type="checkbox" onchange="adminUpstreamCheckAll(this.checked)"></th><th>上游 ID</th><th>名称</th><th>成本</th><th>库存</th><th>激活</th><th>售价预览</th></tr></thead><tbody>';
    for (var i = 0; i < filtered.length; i++){ var up = filtered[i]; var cost = Number(up.cost || up.cost_price || up.price || 0) || 0; var sell = Math.round((cost * markup + fixed) * 100) / 100; var inSt = (up.inStock === false || up.in_stock === 0) ? '<span class="spill red">缺货</span>' : '<span class="spill green">有货</span>'; var reqAct = (up.requiresEmailActivation === true || up.requires_email_activation === true || up.activation === true) ? '是' : '否';
      h += '<tr><td data-label="选择"><input type="checkbox" class="up-check" data-id="' + escH(String(up.id)) + '" onchange="adminUpstreamPreview()"></td><td data-label="上游 ID"><span class="adm-mono">' + escH(String(up.id)) + '</span></td><td data-label="名称">' + escH(up.title || up.name || '') + '</td><td data-label="成本">' + cost.toFixed(2) + ' USDT</td><td data-label="库存">' + inSt + '</td><td data-label="激活">' + reqAct + '</td><td data-label="售价预览">' + sell.toFixed(2) + ' USDT</td></tr>';
    }
    h += '</tbody></table></div>';
  }
  var cat = el('upCatalog');
  if (cat) cat.innerHTML = h;
  adminUpstreamPreview();
}
function adminUpstreamCheckAll(checked){
  var boxes = document.querySelectorAll('.up-check');
  for (var i = 0; i < boxes.length; i++) boxes[i].checked = checked;
  adminUpstreamPreview();
}
async function adminUpstreamPreview(){
  var boxes = document.querySelectorAll('.up-check:checked');
  var pv = el('upPreview');
  if (!pv) return;
  if (!boxes.length){ pv.textContent = ''; return; }
  var settings = await api('/api/admin/settings');
  var sv = (settings && settings.settings) || {};
  var markup = Number(sv.upstream_markup || 1.2) || 1.2;
  var fixed = Number(sv.upstream_fixed || 0) || 0;
  var totalCost = 0, totalSell = 0;
  var cat = window._upCatalog || [];
  for (var i = 0; i < boxes.length; i++){
    var id = boxes[i].getAttribute('data-id');
    for (var j = 0; j < cat.length; j++){ if (String(cat[j].id) === String(id)){ var cost = Number(cat[j].cost || cat[j].cost_price || cat[j].price || 0) || 0; totalCost += cost; totalSell += Math.round((cost * markup + fixed) * 100) / 100; break; } }
  }
  pv.textContent = '已选 ' + boxes.length + ' 件：总成本 ' + totalCost.toFixed(2) + ' USDT，售价合计 ' + totalSell.toFixed(2) + ' USDT（售价 = cost × ' + markup + ' + ' + fixed + '）';
}
async function adminUpstreamSync(){
  var btn = el('syncBtn'); setBtnLoading(btn, true);
  var r = await api('/api/admin/upstream/sync', 'POST', {});
  setBtnLoading(btn, false);
  if (!r.ok){ toast(r.error, 'error'); return; }
  toast('同步成功 ' + r.count + ' 件', 'success');
  renderAdminUpstream();
}
async function adminUpstreamBalance(){
  var r = await api('/api/admin/upstream/balance');
  if (!r.ok){ toast(r.error, 'error'); return; }
  var resEl = el('upRes');
  if (resEl) resEl.textContent = '余额：' + JSON.stringify(r.balance);
  toast('余额已更新', 'success');
}
async function adminUpstreamImport(){
  var boxes = document.querySelectorAll('.up-check:checked');
  if (!boxes.length){ toast('请先勾选要导入的上游商品', 'error'); return; }
  var ids = [];
  for (var i = 0; i < boxes.length; i++) ids.push({ id: boxes[i].getAttribute('data-id') });
  showModal({ title: '批量导入上游商品', bodyHTML: '<p>将导入 <b>' + ids.length + '</b> 件商品。重新导入已存在的商品时，不会覆盖标题与简介（保留人工翻译）。确定导入？</p>', confirmText: '确认导入', onConfirm: async function(){
    var r = await api('/api/admin/upstream/import', 'POST', { items: ids });
    if (!r.ok){ toast(r.error, 'error'); return false; }
    toast('导入 ' + r.imported + ' 件（markup ' + r.markup + ' / fixed ' + r.fixed + '）', 'success');
    adminTab('products');
  }});
}
async function adminUpstreamRetry(orderId){
  showModal({ title: '重试上游轮询', bodyHTML: '<p>将对该订单重新执行上游轮询（已有上游单号时只轮询状态，无单号时用同一 Idempotency-Key 重试下单，不会重复扣费）。确定重试？</p>', confirmText: '确认重试', showInput: true, inputLabel: '重试原因（可选，记入审计）', inputPlaceholder: '如：上游已充值，重新轮询', onConfirm: async function(reason){
    var r = await api('/api/admin/upstream/orders/' + orderId + '/retry', 'POST', { reason: reason || '' });
    if (!r.ok){ toast(r.error, 'error'); return false; }
    toast('重试已执行', 'success');
    renderAdminUpstream();
  }});
}
// ---- 系统设置 ----
function adminSettingField(sv, k, label, rows, hint){
  return '<div class="adm-field"><label>' + escH(label) + '（' + k + '）</label><textarea data-sk="' + k + '" rows="' + (rows || 2) + '">' + escH(sv[k] || '') + '</textarea>' + (hint ? '<div class="hint">' + escH(hint) + '</div>' : '') + '</div>';
}
function adminSettingInput(sv, k, label, hint, type){
  return '<div class="adm-field"><label>' + escH(label) + '（' + k + '）</label><input data-sk="' + k + '" type="' + (type || 'text') + '" value="' + escH(sv[k] || '') + '">' + (hint ? '<div class="hint">' + escH(hint) + '</div>' : '') + '</div>';
}
async function renderAdminSettings(){
  var sr = await api('/api/admin/settings');
  if (!sr.ok){ el('adminBody').innerHTML = '<div class="adm-empty">加载失败：' + escH(sr.error) + '</div>'; return; }
  var sv = sr.settings || {};
  var payMethods = (sr.pay_config && sr.pay_config.methods) || [];
  function payEntry(chain){ for (var i = 0; i < payMethods.length; i++){ if (payMethods[i].pay_chain === chain) return payMethods[i]; } return { address: '', enabled: false }; }
  var payX = payEntry('X Layer');
  var payB = payEntry('BEP20');
  var keyConfigured = !!sr.prodseller_api_key_configured;
  var h = '<div class="admin-page"><div class="admin-page-head"><h2>系统设置</h2></div>';
  h += '<p class="muted">JSON 配置保存前会校验结构与字段，错误时会指出具体字段，不会静默保存无效配置。未修改的配置不会因界面未展示字段而被清空。敏感密钥请走 Secrets，不要写进设置。</p>';
  h += '<div class="adm-card"><h3>基础设置</h3>' + adminSettingInput(sv, 'site_name', '站点名称', '前台显示的站名') + adminSettingField(sv, 'announcement', '公告', 2, '前台顶部公告') + adminSettingField(sv, 'order_notice', '下单须知', 3, '显示在商品详情页') + adminSettingInput(sv, 'tg_link', '客服 / TG 链接', '必须是 http(s) 开头的 URL') + '</div>';
  h += '<div class="adm-card"><h3>收款设置</h3><p class="muted">每链独立开关；地址与开关一起保存，保存时写审计日志（地址记掩码首尾，不记全文）。两个都关闭时付款页显示“收款暂未开放”，商品不可下单；开关只影响新订单，已有待付款订单仍按创建时的收款方式显示。</p>'
    + '<div class="adm-field"><label>X Layer（OKX）收款地址（完整地址）</label><input id="payXlayerAddress" value="' + escH(payX.address || '') + '" placeholder="0x + 40 位十六进制"><div class="hint">买家按此地址转账；非法地址不保存。</div></div>'
    + '<div class="adm-field"><label><input type="checkbox" id="payXlayerEnabled" style="width:auto"' + (payX.enabled ? ' checked' : '') + '> 开启 X Layer 收款</label></div>'
    + '<div class="adm-field"><label>BEP20（Binance）收款地址（完整地址）</label><input id="payBep20Address" value="' + escH(payB.address || '') + '" placeholder="0x + 40 位十六进制"><div class="hint">买家按此地址转账；非法地址不保存。</div></div>'
    + '<div class="adm-field"><label><input type="checkbox" id="payBep20Enabled" style="width:auto"' + (payB.enabled ? ' checked' : '') + '> 开启 BEP20 收款</label></div>'
    + '<div><button class="btn" id="savePayConfigBtn" onclick="adminSavePayConfig()">保存收款设置</button></div>'
    + adminSettingInput(sv, 'binance_uid', '币安 UID', '历史订单恢复用，新订单不再支持币安 UID 站内转账') + adminSettingField(sv, 'pay_tutorials', '支付教程 JSON', 2, '键是支付方式，值是教程 URL') + '</div>';
  h += '<div class="adm-card"><h3>链上到账轮询</h3>' + adminSettingInput(sv, 'poll_enabled', '轮询开关', '1 开 / 0 关（关了只走手动 TXID / 管理员确认）') + adminSettingField(sv, 'rpc_urls', 'RPC 地址 JSON', 3, '键是链，值是 URL 数组，如 {"X Layer":["https://xlayerrpc.okx.com"],"BEP20":["https://bsc-dataseed.binance.org"]}') + adminSettingField(sv, 'usdt_contracts', 'USDT 合约 JSON', 3, '键是链，值是合约地址；X Layer 默认 USDT0，BEP20 默认 Binance-Peg USDT（18 位精度）') + adminSettingField(sv, 'chain_confirmations', '确认数 JSON', 2, '键是链，值是确认数，如 {"X Layer":1,"BEP20":15}；未达确认数不入账、不履约') + '</div>';
  h += '<div class="adm-card"><h3>对接商品 API</h3>'
    + adminSettingInput(sv, 'prodseller_base_url', '上游 Base URL', '存 D1 settings；Env 优先于此设置')
    + '<div class="adm-field"><label>API Key 状态</label><div class="muted">' + (keyConfigured ? '已配置' : '未配置') + '</div><div class="hint">改 Key 走 CF 面板或安全流程；后台只显示“已配置/未配置”，绝不显示 Key 明文。</div></div>'
    + '<div><button class="btn ghost" id="testProdSellerBtn" onclick="adminTestProdSeller()">测试连接</button></div><div id="prodsellerTestRes" style="margin-top:8px"></div>'
    + '<p class="muted">测试连接只调一次 ProdSeller 只读接口（查余额），绝不下单；返回成功/失败 + 失败原因，不泄露 Key。</p></div>';
  h += '<div class="adm-card"><h3>上游与汇率</h3>' + adminSettingInput(sv, 'upstream_markup', '上游加价倍率', '导入售价 = cost × markup + fixed，默认 1.2', 'number') + adminSettingInput(sv, 'upstream_fixed', '上游固定加价', '默认 0', 'number') + adminSettingInput(sv, 'cny_rate', 'CNY 汇率', '前台 CNY 展示汇率，当前 7.2', 'number') + '</div>';
  h += '<div><button class="btn" id="saveSettingsBtn" onclick="adminSaveSettings()">保存设置</button></div></div>';
  el('adminBody').innerHTML = h;
}
async function adminSavePayConfig(){
  var addrX = el('payXlayerAddress') ? el('payXlayerAddress').value.trim() : '';
  var enX = el('payXlayerEnabled') ? (el('payXlayerEnabled').checked ? '1' : '0') : '0';
  var addrB = el('payBep20Address') ? el('payBep20Address').value.trim() : '';
  var enB = el('payBep20Enabled') ? (el('payBep20Enabled').checked ? '1' : '0') : '0';
  var evmRe = /^0x[0-9a-fA-F]{40}$/;
  if (addrX && !evmRe.test(addrX)){ toast('X Layer 收款地址格式无效（须为 0x + 40 位十六进制）', 'error'); return; }
  if (addrB && !evmRe.test(addrB)){ toast('BEP20 收款地址格式无效（须为 0x + 40 位十六进制）', 'error'); return; }
  var btn = el('savePayConfigBtn'); setBtnLoading(btn, true);
  var r = await api('/api/admin/pay-config', 'POST', { xlayer_address: addrX, xlayer_enabled: enX, bep20_address: addrB, bep20_enabled: enB });
  setBtnLoading(btn, false);
  if (!r.ok){ toast(r.error || '保存失败', 'error'); return; }
  toast('收款设置已保存', 'success');
  renderAdminSettings();
}
async function adminTestProdSeller(){
  var btn = el('testProdSellerBtn'); setBtnLoading(btn, true);
  var r = await api('/api/admin/prodseller/test-connection', 'POST', {});
  setBtnLoading(btn, false);
  var box = el('prodsellerTestRes');
  if (!box) return;
  if (!r.ok){ box.innerHTML = '<div class="warn-box">测试失败：' + escH(r.error || '连接失败') + '</div>'; return; }
  box.innerHTML = '<div class="muted">测试成功：已连接 ProdSeller，余额：' + escH(JSON.stringify(r.balance == null ? '' : r.balance)) + '</div>';
}
async function adminSaveSettings(){
  var obj = {};
  var tas = document.querySelectorAll('[data-sk]');
  for (var i = 0; i < tas.length; i++) obj[tas[i].getAttribute('data-sk')] = tas[i].value;
  // 前端先做一层 JSON 校验，错误时指出字段，不发请求
  var jsonKeys = ['pay_tutorials', 'rpc_urls', 'usdt_contracts', 'chain_confirmations'];
  for (var j = 0; j < jsonKeys.length; j++){
    var k = jsonKeys[j];
    if (obj[k] !== undefined) { try { var parsed = JSON.parse(obj[k] || '{}'); if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('x'); } catch (e) { toast('设置 ' + k + ' 不是合法 JSON 对象', 'error'); return; } }
  }
  var btn = el('saveSettingsBtn'); setBtnLoading(btn, true);
  var r = await api('/api/admin/settings', 'POST', { settings: obj });
  setBtnLoading(btn, false);
  if (!r.ok){ toast(r.error, 'error'); return; }
  toast('已保存', 'success');
}
// ---- 操作审计 ----
window._auditFilter = { action: '', order_id: '', page: 1 };
async function renderAdminAudit(page){
  var f = window._auditFilter;
  f.page = page || 1;
  var qs = '/api/admin/audit?page=' + f.page + '&page_size=20';
  if (f.action) qs += '&action=' + encodeURIComponent(f.action);
  if (f.order_id) qs += '&order_id=' + encodeURIComponent(f.order_id);
  var r = await api(qs);
  if (!r.ok){ el('adminBody').innerHTML = '<div class="adm-empty">加载失败：' + escH(r.error) + '</div>'; return; }
  var list = r.audit || [];
  function selOpts3(opts, cur){ var h = ''; for (var i = 0; i < opts.length; i++) h += '<option value="' + opts[i][0] + '"' + (String(cur) === String(opts[i][0]) ? ' selected' : '') + '>' + opts[i][1] + '</option>'; return h; }
  var h = '<div class="admin-page"><div class="admin-page-head"><h2>操作审计</h2></div>';
  h += '<p class="muted">记录确认收款、人工发货、订单取消、上游重试、配置修改等关键操作。审计不记录密码、查单凭证、完整卡密、API Key。</p>';
  h += '<div class="admin-toolbar"><select id="auditAction" onchange="adminAuditSearch()">' + selOpts3([['', '全部操作'], ['confirm_payment', '确认收款（历史）'], ['manual_confirm_payment', '人工确认收款'], ['fulfill', '人工发货'], ['cancel', '取消订单'], ['upstream_retry', '上游重试'], ['settings_update', '配置修改'], ['product_delete', '删除商品'], ['auto_cancel_timeout', '超时自动取消']], f.action) + '</select><input id="auditOrderId" placeholder="按订单 ID 筛选" value="' + escH(f.order_id) + '" onkeydown="if(event.key===\'Enter\')adminAuditSearch()"><button class="btn" onclick="adminAuditSearch()">搜索</button><button class="btn ghost" onclick="adminAuditReset()">重置</button></div>';
  if (!list.length) h += '<div class="adm-empty">暂无审计记录</div>';
  else {
    h += '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>时间</th><th>订单 ID</th><th>操作</th><th>状态变化</th><th>说明</th></tr></thead><tbody>';
    for (var i = 0; i < list.length; i++){ var a = list[i];
      h += '<tr><td data-label="时间">' + escH(fmtTime(a.created_at)) + '</td><td data-label="订单 ID">' + (a.order_id != null ? a.order_id : '—') + '</td><td data-label="操作">' + escH(a.action) + '</td><td data-label="状态变化">' + escH(a.before_status || '-') + ' → ' + escH(a.after_status || '-') + '</td><td data-label="说明">' + escH(a.note || '') + '</td></tr>';
    }
    h += '</tbody></table></div>';
    h += paginationHTML(r.page || 1, r.total_pages || 1, 'renderAdminAudit');
  }
  h += '</div>';
  el('adminBody').innerHTML = h;
}
function adminAuditSearch(){
  var f = window._auditFilter;
  f.action = el('auditAction') ? el('auditAction').value : '';
  f.order_id = el('auditOrderId') ? el('auditOrderId').value.trim() : '';
  renderAdminAudit(1);
}
function adminAuditReset(){ window._auditFilter = { action: '', order_id: '', page: 1 }; renderAdminAudit(1); }


load();
</script>
