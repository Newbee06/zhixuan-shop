<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智选</title>
<style>
:root{--bg:#f2f2f7;--card:rgba(255,255,255,.68);--card2:rgba(255,255,255,.9);--text:#1c1c1e;--sub:#6b7280;--line:rgba(255,255,255,.6);--accent:#0a84ff;--green:#34c759;--orange:#ff9f0a;--red:#ff453a;--radius:24px}
@media (prefers-color-scheme:dark){html:not([data-theme]){--bg:#000;--card:rgba(28,28,30,.62);--card2:rgba(44,44,46,.85);--text:#f5f5f7;--sub:#a1a1aa;--line:rgba(255,255,255,.14)}html:not([data-theme]) .pcard-btn{background:rgba(109,92,255,.28);color:#b7adff}}
html[data-theme="dark"]{--bg:#000;--card:rgba(28,28,30,.62);--card2:rgba(44,44,46,.85);--text:#f5f5f7;--sub:#a1a1aa;--line:rgba(255,255,255,.14)}
html[data-theme="dark"] .pcard-btn{background:rgba(109,92,255,.28);color:#b7adff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 80px}
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:18px;text-decoration:none;color:var(--text);cursor:pointer}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;background:rgba(127,127,127,.12);color:var(--text);font-size:13px}
.nav a.nav-icon{font-size:16px;line-height:1;padding:8px 11px}
.theme-btn{border:0;padding:8px 12px;border-radius:999px;background:rgba(127,127,127,.12);color:var(--text);font-size:14px;cursor:pointer;line-height:1}
.glass{background:var(--card);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.08);padding:18px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.h1{font-size:26px;font-weight:800;margin:6px 0 4px}
.h2{font-size:18px;font-weight:700;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.shop-grid{grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.shop-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.pcard-cat{display:none}}
.card{cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.pcard{padding:12px;display:flex;flex-direction:column;min-width:0;box-shadow:none;border-radius:20px}
.pcard-img{position:relative;background:#fff;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;margin-bottom:12px}
.pcard-img img{max-width:82%;max-height:82%;object-fit:contain}
.pcard-img .emoji{font-size:56px}
.pcard-arrow{position:absolute;top:10px;right:12px;font-size:18px;color:var(--sub)}
.pcard-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.stock-dot{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.stock-dot:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.stock-dot.out{color:var(--red)}
.stock-dot.out:before{background:var(--red)}
.pcard-title{font-size:16px;font-weight:700;margin:10px 0 6px;line-height:1.4}
.pcard-desc{color:var(--sub);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;overflow-wrap:anywhere}
.pcard-foot{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(127,127,127,.15)}
.pcard-price-label{font-size:11px;color:var(--sub)}
.pcard-price{font-size:24px;font-weight:800;line-height:1.2}
.pcard-btn{border:0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#e8e4ff;color:#6d5cff;white-space:nowrap;text-align:center}
.pcard-btn:disabled{background:rgba(127,127,127,.15);color:var(--sub);cursor:not-allowed}
.emoji{font-size:34px}
.price{font-size:22px;font-weight:800;margin:8px 0 2px}
.badge{display:inline-block;font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(10,132,255,.14);color:var(--accent)}
.badge.green{background:rgba(52,199,89,.16);color:var(--green)}
.badge-share{cursor:pointer;border:0;font-family:inherit}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid rgba(127,127,127,.25);background:var(--card2);color:var(--text);font-size:15px;outline:none}
label{font-size:13px;color:var(--sub);display:block;margin:12px 0 6px}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:rgba(127,127,127,.14);color:var(--text)}
.btn.green{background:var(--green)}
.btn.small{padding:8px 13px;font-size:13px}
.btn.block{width:100%;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:9px 8px;border-bottom:1px solid rgba(127,127,127,.18);text-align:left;vertical-align:top;word-break:break-all}
.codebox{background:rgba(127,127,127,.1);border-radius:14px;padding:12px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,monospace;font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:0;padding:9px 14px;border-radius:999px;background:rgba(127,127,127,.14);cursor:pointer;color:var(--text)}
.tabs button.on{background:var(--text);color:var(--bg)}
.search-row{display:flex;gap:10px;margin:14px 0}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap input{padding-left:38px}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--sub);pointer-events:none}
.sort-sel{width:auto;min-width:215px;flex:0 0 auto;cursor:pointer}
.filter-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
@media(max-width:640px){.search-row{flex-direction:column}.sort-sel{width:100%;min-width:0}}
.notice{white-space:pre-wrap}
.footer{margin-top:28px;text-align:center}
.breadcrumb{font-size:13px;color:var(--sub);margin:4px 0 12px}
.breadcrumb a{color:var(--sub)}
.detail-hero{display:flex;gap:16px;align-items:flex-start}
.detail-icon{width:84px;height:84px;flex:0 0 84px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,rgba(10,132,255,.18),rgba(88,86,214,.18));border:1px solid var(--line)}
.detail-price{font-size:30px;font-weight:800;margin:10px 0 2px}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.detail-section{margin-top:16px}
.detail-section h3{font-size:15px;margin:0 0 8px}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.steps{grid-template-columns:1fr}}
.step{background:rgba(127,127,127,.08);border-radius:16px;padding:12px}
.step b{display:block;margin-bottom:4px}
.qty-row{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.qty-btn{width:44px;border:0;background:var(--accent);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.qty-input{width:64px;text-align:center;border:0;background:transparent;font-size:16px;font-weight:700;color:var(--text);padding:10px 0}
.total-box{display:flex;justify-content:space-between;align-items:center;background:rgba(10,132,255,.08);border:1px solid rgba(10,132,255,.2);border-radius:16px;padding:12px 14px;margin-top:14px}
.sticky-buy{position:sticky;bottom:12px;margin-top:16px;background:var(--card2);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.related{margin-top:18px}
.detail-top{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
@media(max-width:720px){.detail-top{grid-template-columns:1fr}}
.detail-img{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:380px;font-size:120px;background:var(--card2);border-radius:var(--radius);text-align:center;padding:24px;position:relative}
@media(max-width:720px){.detail-img{min-height:240px;font-size:88px}}
.detail-img-cap{font-size:17px;font-weight:700;line-height:1.5;max-width:100%}
.detail-tabs{display:flex;gap:18px;border-bottom:1px solid rgba(127,127,127,.2);margin-bottom:14px}
.detail-tabs span{font-size:16px;font-weight:700;padding:10px 2px;border-bottom:3px solid var(--accent);margin-bottom:-1px}
.buy-box{position:sticky;top:64px}
@media(max-width:720px){.buy-box{position:static}}
.buy-price{font-size:32px;font-weight:800;color:var(--red);margin:6px 0 2px}
.buy-price small{font-size:13px;color:var(--sub);font-weight:400}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.pay-options{align-items:center}
.pay-logo{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.pay-card{background:var(--card2);border-radius:14px;padding:12px 14px;margin:6px 0}
.pay-card-title{font-weight:700;font-size:15px;margin-bottom:10px;color:var(--accent)}
.pill{padding:8px 12px;border-radius:999px;border:1.5px solid rgba(127,127,127,.3);background:var(--card2);cursor:pointer;font-size:13px;color:var(--text)}
.pill.on{border-color:var(--accent);background:rgba(10,132,255,.14);color:var(--accent);font-weight:700}
.pill .rec{font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.detail-blocks{margin-top:18px}
.detail-block{border-left:4px solid var(--accent);background:var(--card);border-radius:0 16px 16px 0;padding:14px 16px;margin:12px 0}
.detail-block.green{border-color:var(--green)}
.detail-block.orange{border-color:var(--orange)}
.detail-block.red{border-color:var(--red)}
.detail-block h3{margin:0 0 8px;font-size:15px}
.detail-block p{margin:0;font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap}
.warn-box{background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.3);border-radius:16px;padding:12px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:720px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat-card .num{font-size:26px;font-weight:800;margin-top:4px}
.stat-card .lbl{font-size:13px;color:var(--sub)}
.stat-card.warn .num{color:var(--orange)}
.stat-card.bad .num{color:var(--red)}
.stat-card.good .num{color:var(--green)}
.seg{display:flex;gap:6px;flex-wrap:wrap;background:rgba(127,127,127,.12);border-radius:999px;padding:5px;width:fit-content;max-width:100%;margin:4px 0}
@media(max-width:640px){.seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:0 0 auto}}
@media(max-width:640px){.btn.small{padding:10px 16px;font-size:14px}}
.order-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.order-grid{grid-template-columns:1fr 1fr}}
.order-grid .admin-card{margin:0}
@media(max-width:640px){
  .table.resp tr:first-child{display:none}
  .table.resp, .table.resp tbody, .table.resp tr, .table.resp td{display:block;width:100%}
  .table.resp tr{border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px;background:var(--card)}
  .table.resp td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:right;overflow-wrap:anywhere}
  .table.resp td::before{content:attr(data-label);color:var(--sub);text-align:left;flex:0 0 auto}
}
.table-card{padding:0;overflow:hidden}
@media(max-width:640px){.table-card{padding:12px;overflow:visible}}
.seg button{border:0;padding:9px 16px;border-radius:999px;background:transparent;cursor:pointer;color:var(--text);font-size:14px;font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.admin-layout{display:flex;gap:16px;align-items:flex-start}
.admin-side{position:sticky;top:16px;width:220px;flex:0 0 220px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.admin-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.admin-nav{display:flex;flex-direction:column;gap:6px}
.admin-nav button{border:0;background:transparent;color:var(--text);text-align:left;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.admin-nav button.on{background:var(--text);color:var(--bg)}
.admin-side-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.admin-main{flex:1;min-width:0}
.admin-topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.admin-burger{display:none;border:0;background:rgba(127,127,127,.14);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;color:var(--text)}
.admin-backdrop{display:none}
.admin-side-close{display:none;border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--sub)}
@media(max-width:860px){
  .admin-layout{display:block}
  .admin-side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:260px;max-width:80vw;border-radius:0;transform:translateX(-110%);transition:transform .25s;overflow-y:auto}
  .admin-layout.side-open .admin-side{transform:none}
  .admin-layout.side-open .admin-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .admin-burger{display:block}
  .admin-side-close{display:block}
}
.admin-group-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 4px;user-select:none}
.admin-group-chev{transition:transform .2s;display:inline-block;color:var(--sub)}
.admin-group.collapsed .admin-group-body{display:none}
.admin-group.collapsed .admin-group-chev{transform:rotate(-90deg)}
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.order-card{padding:16px}
.spill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600}
.spill.orange{background:rgba(255,159,10,.16);color:var(--orange)}
.spill.blue{background:rgba(10,132,255,.16);color:var(--accent)}
.spill.purple{background:rgba(88,86,214,.18);color:#7d7aff}
.spill.red{background:rgba(255,69,58,.14);color:var(--red)}
.spill.green{background:rgba(52,199,89,.16);color:var(--green)}
.spill.gray{background:rgba(127,127,127,.18);color:var(--sub)}
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.prod-grid{grid-template-columns:1fr 1fr}}
.admin-card.prod-card{margin:0;padding:12px;box-shadow:none}
.prod-card b{font-size:16px;font-weight:700}
.prod-card .muted{font-size:12px}
.prod-card .price{font-size:24px}
.prod-emoji{font-size:56px}
.prod-img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:16px;display:block}
.prod-img.prod-emoji{display:flex;align-items:center;justify-content:center;font-size:56px}
.detail-img-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#fff}
@media(max-width:720px){.detail-img-photo{position:static;height:auto;aspect-ratio:1/1}}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.field-grid{grid-template-columns:1fr}}
.empty{background:var(--card);border:1px dashed rgba(127,127,127,.35);border-radius:18px;padding:22px;text-align:center;color:var(--sub);font-size:14px;margin:14px 0}
.btn.danger{background:rgba(255,69,58,.12);color:var(--red)}
/* ===== 管理后台 SaaS 风格（信息密度优先，克制玻璃感） ===== */
.admin-page{max-width:1200px;margin:0 auto}
.admin-page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.admin-page-head h2{font-size:20px;font-weight:800;margin:0}
.admin-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.admin-toolbar input,.admin-toolbar select{width:auto;min-width:0;flex:1 1 140px;padding:9px 11px;font-size:14px;border-radius:10px}
.admin-toolbar select{flex:0 1 160px}
.admin-toolbar .btn{padding:9px 16px;font-size:14px}
.adm-card{background:var(--card2);border:1px solid rgba(127,127,127,.18);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.adm-card h3{font-size:15px;margin:0 0 10px}
.adm-stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:860px){.adm-stat-grid{grid-template-columns:repeat(2,1fr)}}
.adm-stat{background:var(--card2);border:1px solid rgba(127,127,127,.18);border-radius:14px;padding:12px 14px;cursor:pointer}
.adm-stat:hover{border-color:var(--accent)}
.adm-stat .lbl{font-size:12px;color:var(--sub)}
.adm-stat .num{font-size:24px;font-weight:800;margin-top:2px}
.adm-stat.warn .num{color:var(--orange)}
.adm-stat.bad .num{color:var(--red)}
.adm-stat.good .num{color:var(--green)}
.adm-table-wrap{overflow-x:auto;border:1px solid rgba(127,127,127,.18);border-radius:14px;background:var(--card2)}
.adm-table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.adm-table th,.adm-table td{padding:10px 12px;border-bottom:1px solid rgba(127,127,127,.14);text-align:left;vertical-align:top;word-break:break-word}
.adm-table th{font-size:12px;color:var(--sub);font-weight:600;background:rgba(127,127,127,.06);white-space:nowrap}
.adm-table tr:last-child td{border-bottom:0}
.adm-table .mono{font-family:ui-monospace,monospace;font-size:12px}
.adm-mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
@media(max-width:640px){
  .adm-table{min-width:0}
  .adm-table thead{display:none}
  .adm-table,.adm-table tbody,.adm-table tr,.adm-table td{display:block;width:100%}
  .adm-table tr{border-bottom:1px solid rgba(127,127,127,.14);padding:10px 12px}
  .adm-table tr:last-child{border-bottom:0}
  .adm-table td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .adm-table td::before{content:attr(data-label);color:var(--sub);text-align:left;flex:0 0 auto;font-size:12px}
}
.adm-pagination{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.adm-pagination .btn{padding:8px 14px;font-size:13px}
.adm-pagination .btn:disabled{opacity:.4;cursor:not-allowed}
.adm-empty{background:var(--card2);border:1px dashed rgba(127,127,127,.35);border-radius:14px;padding:24px;text-align:center;color:var(--sub);font-size:14px;margin:12px 0}
.adm-field{margin:10px 0}
.adm-field label{font-size:13px;color:var(--sub);display:block;margin:0 0 5px}
.adm-field input,.adm-field select,.adm-field textarea{padding:10px 12px;font-size:14px;border-radius:10px}
.adm-field .hint{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.adm-field .err{font-size:12px;color:var(--red);margin-top:4px}
.adm-field.invalid input,.adm-field.invalid textarea,.adm-field.invalid select{border-color:var(--red)}
/* Toast / Modal / Drawer */
.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:420px;padding:0 14px}
.toast{background:#1c1c1e;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:100%;word-break:break-word;text-align:center}
.toast.success{background:#1e7a34}
.toast.error{background:#c81e1e}
.toast.warn{background:#8a5a00}
html[data-theme="light"] .toast{background:#1c1c1e;color:#fff}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card2);border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:0 16px 60px rgba(0,0,0,.25)}
.modal h3{font-size:17px;margin:0 0 10px}
.modal .modal-body{font-size:14px;line-height:1.7;color:var(--text)}
.modal .modal-body .muted{font-size:13px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:var(--card2);z-index:151;overflow-y:auto;padding:20px;box-shadow:-8px 0 40px rgba(0,0,0,.2)}
.drawer h3{font-size:17px;margin:0 0 12px}
.drawer .drawer-close{position:absolute;top:14px;right:14px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--sub)}
.drawer-section{margin:14px 0;padding-top:12px;border-top:1px solid rgba(127,127,127,.18)}
.drawer-section h4{font-size:13px;color:var(--sub);margin:0 0 8px}
.drawer-kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;line-height:1.6}
.drawer-kv .k{color:var(--sub)}
.drawer-kv .v{word-break:break-all}
.btn.loading{opacity:.6;pointer-events:none}
.btn.loading::after{content:' …'}
.skeleton{background:linear-gradient(90deg,rgba(127,127,127,.12),rgba(127,127,127,.22),rgba(127,127,127,.12));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:16px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

<body>
<header class="top"><div class="top-in"><a class="logo" href="#/"><span id="siteName">智选</span></a><nav class="nav"><a class="nav-icon" href="#/" title="商城" aria-label="商城">🛍️</a><a class="nav-icon" href="#/query" title="查询订单" aria-label="查询订单">🔍</a><button id="themeBtn" class="theme-btn" onclick="toggleTheme()" title="切换深浅色">🌙</button></nav></div></header>
<main class="wrap"><div id="announce" class="glass muted" style="margin-bottom:14px"></div><div id="app"></div><div class="footer muted">虚拟商品一经交付不退换，下单前请仔细阅读商品说明。</div></main>
<script>
var CFG = null;
var PRODUCTS = [];
var curStock = 'all';
var curSort = 'featured';
var curQ = '';
function currentTheme(){ if (document.documentElement.dataset.theme) return document.documentElement.dataset.theme; return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
function renderThemeBtn(){ var b = el('themeBtn'); if (b) b.textContent = currentTheme() === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(){ var next = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('theme', next); } catch (e) {} renderThemeBtn(); }
renderThemeBtn();
function el(id){ return document.getElementById(id); }
function escH(s){ var t = String(s == null ? '' : s); return t.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;'); }
// 统一 API：网络失败 / 非 JSON / 未授权 / 超时 / 业务错误一律转成 {ok:false, error}，调用方不用再 try/catch JSON 解析。
async function api(p, m, b){
  var ctrl = null, timer = null;
  try {
    if (typeof AbortController !== 'undefined') { ctrl = new AbortController(); timer = setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, 30000); }
    var res = await fetch(p, { method: m || 'GET', headers: {'content-type': 'application/json'}, body: b ? JSON.stringify(b) : undefined, signal: ctrl ? ctrl.signal : undefined });
    if (timer) clearTimeout(timer);
    var text = '';
    try { text = await res.text(); } catch (e) { return { ok: false, error: '网络异常，请检查网络后重试', _http: res.status }; }
    var j = null;
    try { j = JSON.parse(text); } catch (e) { return { ok: false, error: '服务器返回异常（非 JSON），状态 ' + res.status, _http: res.status }; }
    if (res.status === 401) return { ok: false, error: (j && j.error) || '未登录或凭证已过期', _http: 401, _unauth: true };
    if (!res.ok && j && j.ok === undefined) return { ok: false, error: j.error || ('请求失败，状态 ' + res.status), _http: res.status };
    return j;
  } catch (e) {
    if (timer) clearTimeout(timer);
    if (e && e.name === 'AbortError') return { ok: false, error: '请求超时，请重试' };
    return { ok: false, error: '网络异常，请检查网络后重试' };
  }
}
function copyText(t){
  function done(){ toast('已复制', 'success'); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done).catch(function(){ fallbackCopy(t); }); return; }
  fallbackCopy(t);
  function fallbackCopy(v){ var ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制', 'error'); } ta.remove(); }
}
// ---- Toast / Modal / Drawer（统一交互，替代原生 alert/confirm/prompt） ----
function toast(msg, type){
  var wrap = el('toastWrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toastWrap'; wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  var t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(function(){ try { t.remove(); } catch (e) {} }, type === 'error' ? 4200 : 2800);
}
function showModal(opts){
  // opts: {title, bodyHTML, confirmText, cancelText, danger, onConfirm, onCancel, showInput, inputLabel, inputPlaceholder, inputValue}
  closeModal();
  var bd = document.createElement('div');
  bd.className = 'modal-backdrop'; bd.id = 'modalBackdrop';
  bd.addEventListener('click', function(e){ if (e.target === bd) { if (opts.onCancel) opts.onCancel(); closeModal(); } });
  var inputHtml = '';
  if (opts.showInput) inputHtml = '<div class="adm-field"><label>' + escH(opts.inputLabel || '说明') + '</label><textarea id="modalInput" rows="2" placeholder="' + escH(opts.inputPlaceholder || '') + '">' + escH(opts.inputValue || '') + '</textarea></div>';
  bd.innerHTML = '<div class="modal"><h3>' + escH(opts.title || '确认') + '</h3><div class="modal-body">' + (opts.bodyHTML || '') + '</div>' + inputHtml + '<div class="modal-actions"><button class="btn ghost" id="modalCancel">' + escH(opts.cancelText || '取消') + '</button><button class="btn' + (opts.danger ? ' danger' : '') + '" id="modalConfirm">' + escH(opts.confirmText || '确认') + '</button></div></div>';
  document.body.appendChild(bd);
  var confirmBtn = document.getElementById('modalConfirm');
  el('modalCancel').addEventListener('click', function(){ if (opts.onCancel) opts.onCancel(); closeModal(); });
  confirmBtn.addEventListener('click', function(){
    if (confirmBtn.classList.contains('loading')) return;
    var inputVal = opts.showInput ? (el('modalInput') ? el('modalInput').value : '') : '';
    if (opts.onConfirm) {
      confirmBtn.classList.add('loading');
      var ret = opts.onConfirm(inputVal, function(){ confirmBtn.classList.remove('loading'); });
      // onConfirm 返回 false 时不关闭（用于校验失败）；返回 Promise 时等它完成
      if (ret && typeof ret.then === 'function') { ret.then(function(r){ if (r !== false) closeModal(); }).catch(function(){ confirmBtn.classList.remove('loading'); }); }
      else if (ret !== false) closeModal();
      else confirmBtn.classList.remove('loading');
    } else closeModal();
  });
  return bd;
}
function closeModal(){ var b = el('modalBackdrop'); if (b) b.remove(); }
function showDrawer(title, bodyHTML){
  closeDrawer();
  var bd = document.createElement('div');
  bd.className = 'drawer-backdrop'; bd.id = 'drawerBackdrop';
  bd.addEventListener('click', closeDrawer);
  var dr = document.createElement('div');
  dr.className = 'drawer'; dr.id = 'drawerPanel';
  dr.innerHTML = '<button class="drawer-close" onclick="closeDrawer()">✕</button><h3>' + escH(title || '') + '</h3>' + (bodyHTML || '');
  document.body.appendChild(bd);
  document.body.appendChild(dr);
  return dr;
}
function closeDrawer(){ var b = el('drawerBackdrop'); if (b) b.remove(); var d = el('drawerPanel'); if (d) d.remove(); }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeModal(); closeDrawer(); } });
function setBtnLoading(btn, loading){
  if (!btn) return;
  if (loading) { btn.classList.add('loading'); btn.disabled = true; }
  else { btn.classList.remove('loading'); btn.disabled = false; }
}
function paginationHTML(p, totalPages, fnName){
  if (!totalPages || totalPages <= 1) return '';
  var h = '<div class="adm-pagination">';
  h += '<button class="btn ghost" ' + (p <= 1 ? 'disabled' : '') + ' onclick="' + fnName + '(' + (p - 1) + ')">上一页</button>';
  h += '<span class="muted">第 ' + p + ' / ' + totalPages + ' 页</span>';
  h += '<button class="btn ghost" ' + (p >= totalPages ? 'disabled' : '') + ' onclick="' + fnName + '(' + (p + 1) + ')">下一页</button>';
  return h + '</div>';
}
function fmtTime(s){ return s ? String(s).replace('T', ' ') : ''; }
function catLabel(c){ if (c === 'recharge') return '代充'; if (c === 'account') return '成品号'; if (c === 'card') return '卡密'; return c; }
function statusLabel(s){ if (s === 'pending_payment') return '待付款'; if (s === 'pending_fulfill') return '待发货'; if (s === 'pending_activation') return '激活待处理'; if (s === 'pending_upstream') return '待处理'; if (s === 'refund_pending') return '退款待处理'; if (s === 'completed') return '已完成'; if (s === 'cancelled') return '已取消'; return s; }
function fmtCountdown(exp){ if (!exp) return ''; var diff = Math.max(0, new Date(String(exp).replace(' ', 'T') + 'Z').getTime() - Date.now()); var m = Math.floor(diff / 60000); var s = Math.floor((diff % 60000) / 1000); return m + '分' + (s < 10 ? '0' : '') + s + '秒'; }
function cnyRate(){ var r = CFG && CFG.cny_rate ? Number(CFG.cny_rate) : 7.2; return (isFinite(r) && r > 0) ? r : 7.2; }
function fmtCNY(usdt){ return '¥' + (Number(usdt || 0) * cnyRate()).toFixed(2); }
function fmtPrice(usdt){ return fmtCNY(usdt) + ' <span class="muted" style="font-size:13px">约 ' + Number(usdt || 0).toFixed(2) + ' USDT</span>'; }
function productThumb(p){
  if (p && p.image_data && String(p.image_data).indexOf('data:image/') === 0) return '<img src="' + escH(p.image_data) + '" class="prod-img" alt="">';
  return '<div class="prod-img prod-emoji">' + escH((p && p.image_emoji) || '🤖') + '</div>';
}
async function load(){ var r = await api('/api/config'); if (r.ok) CFG = r.config; var pr = await api('/api/products'); if (pr.ok) PRODUCTS = pr.products; if (CFG) { el('siteName').textContent = CFG.site_name; el('announce').textContent = CFG.announcement || ''; } route(); }
function route(){ var h = location.hash || '#/'; if (h.indexOf('#/product/') === 0) { renderProduct(h.split('/')[2]); } else if (h.indexOf('#/success/') === 0) { renderSuccess(h.split('/')[2]); } else if (h === '#/query') { renderQuery(); } else if (h === '#/admin') { renderAdmin(); } else { renderShop(); } }
window.addEventListener('hashchange', route);
function renderShop(){
  curQ = '';
  var html = '<div class="h1">选购你的虚拟商品</div><div class="muted">下单后按页面收款地址付精确金额，付完成功后自动发货。</div>';
  html += '<div class="search-row"><div class="search-wrap"><span class="search-icon">🔍</span><input id="q" placeholder="搜索商品…" oninput="doSearch()"></div><select id="sortSel" class="sort-sel" onchange="changeSort(this.value)"><option value="featured">排序方式：精选</option><option value="price-asc">排序方式：价格从低到高</option><option value="price-desc">排序方式：价格从高到低</option><option value="name-asc">排序方式：名称：A 到 Z</option></select></div>';
  html += '<div class="filter-row"><div class="tabs" style="margin:0"><button id="pill-all" onclick="filterStock(\x27all\x27)">全部 <span id="cntAll"></span></button><button id="pill-instock" onclick="filterStock(\x27instock\x27)"><span class="stock-dot"></span> 有货 <span id="cntStock"></span></button></div><div class="muted" id="prodCount"></div></div><div id="list" class="grid shop-grid"></div>';
  el('app').innerHTML = html;
  var ss = el('sortSel'); if (ss) ss.value = curSort;
  renderList();
}
function filterStock(s){ curStock = s; renderList(); }
function doSearch(){ curQ = el('q').value || ''; renderList(); }
function changeSort(v){ curSort = v; renderList(); }
function productCard(p){
  var inSt = Number(p.in_stock == null ? 1 : p.in_stock);
  var img = (p.image_data && String(p.image_data).indexOf('data:image/') === 0) ? '<img src="' + escH(p.image_data) + '" alt="">' : '<div class="emoji">' + escH(p.image_emoji || '🤖') + '</div>';
  var stock = inSt ? '<span class="stock-dot">有存货</span>' : '<span class="stock-dot out">缺货</span>';
  var btn = inSt ? '<button class="pcard-btn" onclick="event.stopPropagation();location.hash=\x27#/product/' + p.id + '\x27">立即购买 +</button>' : '<button class="pcard-btn" disabled>售罄</button>';
  return '<div class="glass card pcard" data-pid="' + p.id + '" onclick="location.hash=\x27#/product/' + p.id + '\x27"><div class="pcard-img">' + img + '<span class="pcard-arrow">↗</span></div><div class="pcard-meta">' + stock + '<span class="muted pcard-cat">数字产品</span></div><div class="pcard-title">' + escH(p.title) + '</div><div class="pcard-desc">' + escH(p.description || '') + '</div><div class="pcard-foot"><div><div class="pcard-price-label">您的价格</div><div class="pcard-price">' + fmtCNY(p.price_usdt) + '</div></div>' + btn + '</div></div>';
}
function renderList(){
  var list = PRODUCTS.filter(function(p){
    if (curStock === 'instock' && Number(p.in_stock == null ? 1 : p.in_stock) !== 1) return false;
    if (curQ && p.title.indexOf(curQ) === -1) return false;
    return true;
  });
  if (curSort === 'price-asc') list.sort(function(a, b){ return Number(a.price_usdt || 0) - Number(b.price_usdt || 0); });
  else if (curSort === 'price-desc') list.sort(function(a, b){ return Number(b.price_usdt || 0) - Number(a.price_usdt || 0); });
  else if (curSort === 'name-asc') list.sort(function(a, b){ return String(a.title || '').localeCompare(String(b.title || ''), 'zh-CN'); });
  var h = '';
  if (!list.length) h = '<div class="muted">暂无商品</div>';
  for (var i = 0; i < list.length; i++){ h += productCard(list[i]); }
  el('list').innerHTML = h;
  var allBtn = el('pill-all'), stBtn = el('pill-instock');
  if (allBtn) allBtn.className = curStock === 'all' ? 'on' : '';
  if (stBtn) stBtn.className = curStock === 'instock' ? 'on' : '';
  var cA = el('cntAll'), cS = el('cntStock');
  if (cA) cA.textContent = PRODUCTS.length;
  if (cS) cS.textContent = PRODUCTS.filter(function(p){ return Number(p.in_stock == null ? 1 : p.in_stock) === 1; }).length;
  var pc = el('prodCount');
  if (pc) pc.textContent = list.length + ' 种产品';
}
async function renderProduct(id){
  var r = await api('/api/products/' + id);
  if (!r.ok){ el('app').innerHTML = '<div class="muted">商品不存在 · <a href="#/">回商城</a></div>'; return; }
  var p = r.product;
  window._curProduct = p;
  window._payMethod = 'OKX';
  window._payChain = 'X Layer';
  var payOpts = '<button type="button" class="pill pay-opt on" data-pm="OKX" data-pc="X Layer" onclick="selectPayOption(this)"><svg class="pay-logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="8.5" height="8.5" rx="1.5" fill="currentColor"/><rect x="13" y="2.5" width="8.5" height="8.5" rx="1.5" fill="currentColor"/><rect x="2.5" y="13" width="8.5" height="8.5" rx="1.5" fill="currentColor"/><rect x="13" y="13" width="8.5" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>USDT · X Layer</button><button type="button" class="pill pay-opt" data-pm="Binance" data-pc="BEP20" onclick="selectPayOption(this)"><svg class="pay-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6 22.4 12 12 22.4 1.6 12Z" fill="#F0B90B"/><path d="M12 7.2 16.8 12 12 16.8 7.2 12Z" fill="#fff"/></svg>USDT · BEP20</button>';
  var fh = '';
  for (var i = 0; i < p.form_fields.length; i++){ var f = p.form_fields[i]; fh += '<label>' + escH(f.label) + (f.required ? ' *' : '') + '</label><input data-k="' + escH(f.key) + '" placeholder="' + escH(f.placeholder || '') + '">'; }
  var inSt = Number(p.in_stock == null ? 1 : p.in_stock);
  var badgeMain = inSt === 0 ? '<span class="badge" style="background:rgba(255,69,58,.14);color:var(--red)">缺货 · 补货中</span>' : '<span class="badge green">自动发货</span>';

  else html += '<div class="glass detail-img">' + escH(p.image_emoji) + '<div class="detail-img-cap">' + escH(p.title) + '</div></div>';
  html += '<div class="glass buy-box"><div class="h1" style="margin-top:0;font-size:22px">' + escH(p.title) + '</div><div class="detail-meta badge-row">' + badgeMain + '<span class="badge" style="background:rgba(88,86,214,.14);color:#7d7aff">已售 ' + Number(p.sold_count || 0) + '</span><button type="button" class="badge badge-share" onclick="copyText(location.href)" title="复制商品链接">↗</button></div>';
  html += '<div class="buy-price">' + fmtCNY(p.price_usdt) + ' <small>约 ' + Number(p.price_usdt||0).toFixed(2) + ' USDT · 单价</small></div>';
  html += fh;
  if (p.requires_email_activation) {
    html += '<label>激活邮箱（要开通会员的邮箱，必须填对） *</label><input id="activation_email" type="email" placeholder="要开通会员的邮箱"><label>再次确认激活邮箱 *</label><input id="activation_email_confirm" type="email" placeholder="再输一次激活邮箱"><label><input type="checkbox" id="activation_confirm" style="width:auto"> 我已确认：这是要开通的邮箱，填错无法开通</label>';
  }

  html += '<label>人机验证</label><div class="row" style="flex-wrap:nowrap;align-items:stretch"><input id="captchaCode" placeholder="输入图中 4 位字符" maxlength="4" style="flex:1;min-width:0" autocomplete="off"><img id="captchaImg" alt="验证码" title="点击刷新" style="width:120px;height:44px;border-radius:12px;cursor:pointer;flex:0 0 120px;background:#f2f2f7" onclick="loadCaptcha()"></div><div class="muted" style="margin-top:4px">看不清？点击图片刷新</div>';
  html += '<div class="pay-card"><div class="pay-card-title">🛒 付款</div><div class="pills pay-options" id="payOptions">' + payOpts + '</div></div>';
  html += actHint;
  html += '<div class="total-box"><span>合计 <span id="stickyQty">1</span> 件</span><span><b id="totalPrice" style="font-size:20px">' + fmtCNY(p.price_usdt) + '</b> <span class="muted" id="totalUsdt">约 ' + Number(p.price_usdt||0).toFixed(2) + ' USDT</span></span></div>';
  html += '<div style="margin-top:14px">' + (inSt === 0 ? '<button class="btn block" disabled style="background:rgba(127,127,127,.3);cursor:not-allowed">缺货 · 补货中</button>' : '<button class="btn block" data-pid="' + p.id + '" onclick="submitOrder(this.dataset.pid)">立即购买</button>') + '</div>';
  html += '</div></div>';

function handleProductImage(file, pfx){
  if (!file) return;
  if (file.type.indexOf('image/') !== 0){ toast('请选择图片文件', 'error'); return; }
  if (file.size > 2 * 1024 * 1024){ toast('图片不能超过 2MB', 'error'); return; }
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      var cv = document.createElement('canvas'); cv.width = 800; cv.height = 800;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, 800, 800);
      var url = cv.toDataURL('image/jpeg', 0.82);
      if (url.length > 700000) url = cv.toDataURL('image/jpeg', 0.6);
      if (url.length > 700000){ toast('图片压缩后仍超过 500KB，请换一张更小的图', 'error'); return; }
      window._productImage = window._productImage || {};
      window._productImage[pfx] = url;
      var pv = el(pfx + 'imgpv');
      if (pv) pv.innerHTML = '<img src="' + url + '" style="width:120px;height:120px;object-fit:cover;border-radius:16px">';
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

  toast(dis === '1' || dis === 1 ? '已禁用' : '已启用', 'success');
  renderAdminCards(window._cardFilter.page || 1);
}
async function adminDelCard(id){
  showModal({ title: '删除卡密', bodyHTML: '<p>确定删除该卡密？已用 / 被预留的卡密受保护，无法删除。</p>', confirmText: '确认删除', danger: true, onConfirm: async function(){
    var r = await api('/api/admin/cards/' + id, 'DELETE');
    if (!r.ok){ toast(r.error, 'error'); return false; }
    toast('已删除', 'success');
    renderAdminCards(window._cardFilter.page || 1);
  }});
}
// ---- 上游管理 ----
async function renderAdminUpstream(){
  var al = await api('/api/admin/upstream/alerts');
  var alerts = (al && al.alerts) || [];
  var cache = await api('/api/admin/upstream/cache');
  var hasCache = !!(cache && cache.cached);
  var settings = await api('/api/admin/settings');
  var sv = (settings && settings.settings) || {};
  var markup = Number(sv.upstream_markup || 1.2) || 1.2;
  var fixed = Number(sv.upstream_fixed || 0) || 0;
  var h = '<div class="admin-page"><div class="admin-page-head"><h2>上游管理</h2></div>';
  h += '<div class="adm-card"><h3>第一步：同步上游商品</h3><p class="muted">同步限速 300 / 15min，结果缓存到 upstream_cache，导入只从缓存读，不直接拉上游。售价 = cost × ' + markup + ' + ' + fixed + '（在设置里配）。</p><div class="row"><button class="btn" id="syncBtn" onclick="adminUpstreamSync()">同步上游商品</button> <button class="btn ghost" onclick="adminUpstreamBalance()">查余额</button></div><div id="upRes" class="muted" style="margin-top:10px">' + (hasCache ? '缓存有效：同步于 ' + escH(fmtTime(cache.fetched_at)) + '，共 ' + (Array.isArray(cache.payload) ? cache.payload.length : (cache.payload && Array.isArray(cache.payload.products) ? cache.payload.products.length : 0)) + ' 件。点同步可刷新。' : '暂无缓存，请先同步。') + '</div></div>';
  h += '<div class="adm-card"><h3>第二步：浏览商品目录（来自缓存）</h3><p class="muted">勾选要导入的商品，导入前会展示成本、加价与最终售价预览。重新导入已存在的商品时，不会覆盖管理员人工修改的标题与简介。</p><div class="admin-toolbar"><input id="upQ" placeholder="搜索上游商品名称 / ID" oninput="adminUpstreamFilter()"><button class="btn" onclick="adminUpstreamImport()">批量导入已选</button></div><div id="upCatalog">' + (hasCache ? '<div class="muted">加载中…</div>' : '<div class="muted">暂无缓存，请先同步。</div>') + '</div><div id="upPreview" class="muted" style="margin-top:10px"></div></div>';
  h += '<div class="adm-card"><h3>第三步：上游订单与异常</h3>';
  if (!alerts.length) h += '<div class="muted">暂无置顶告警（pending_upstream 订单）</div>';
  else { h += '<table class="adm-table"><tr><th>订单号</th><th>原因</th><th>操作</th></tr>'; for (var ai = 0; ai < alerts.length; ai++){ var ao = alerts[ai]; h += '<tr><td data-label="订单号"><span class="adm-mono">' + escH(ao.order_no) + '</span></td><td data-label="原因">' + escH(ao.admin_note || '') + '</td><td data-label="操作"><button class="btn small" data-id="' + ao.id + '" onclick="adminOrderDetail(this.dataset.id)">详情</button> <button class="btn small ghost" data-id="' + ao.id + '" onclick="adminUpstreamRetry(' + ao.id + ')">重试</button></td></tr>'; } h += '</table>'; }
  h += '</div>';
  h += '<div class="adm-card"><h3>上游订单列表</h3><div id="upOrders"><div class="muted">加载中…</div></div></div>';
  h += '</div>';
  el('adminBody').innerHTML = h;
  if (hasCache) adminUpstreamFilter();
  var uo = await api('/api/admin/upstream/orders?page_size=10');
  var uoEl = el('upOrders');
  if (uoEl) {
    var uolist = (uo && uo.upstream_orders) || [];
    if (!uolist.length) uoEl.innerHTML = '<div class="muted">暂无上游订单</div>';
    else { var uh = '<table class="adm-table"><tr><th>订单ID</th><th>上游单号</th><th>状态</th><th>金额</th><th>创建时间</th></tr>'; for (var ui = 0; ui < uolist.length; ui++){ var u = uolist[ui]; uh += '<tr><td data-label="订单ID">' + u.order_id + '</td><td data-label="上游单号"><span class="adm-mono">' + escH(u.prodseller_order_id) + '</span></td><td data-label="状态">' + escH(u.status) + '</td><td data-label="金额">' + u.amount + '</td><td data-label="创建时间">' + escH(fmtTime(u.created_at)) + '</td></tr>'; } uh += '</table>'; uoEl.innerHTML = uh; }
  }
}
window._upCatalog = [];
async function adminUpstreamFilter(){
  var cache = await api('/api/admin/upstream/cache');
  var payload = (cache && cache.payload) || {};
  var arr = Array.isArray(payload) ? payload : (payload.products || []);
  window._upCatalog = arr;
  var q = (el('upQ') ? el('upQ').value.trim().toLowerCase() : '');
  var filtered = arr.filter(function(x){ if (!q) return true; return String(x.title || x.name || '').toLowerCase().indexOf(q) !== -1 || String(x.id).toLowerCase().indexOf(q) !== -1; });
  var settings = await api('/api/admin/settings');
  var sv = (settings && settings.settings) || {};
  var markup = Number(sv.upstream_markup || 1.2) || 1.2;
  var fixed = Number(sv.upstream_fixed || 0) || 0;
  var h = '';
  if (!filtered.length) h = '<div class="adm-empty">暂无符合条件的上游商品</div>';
  else {
    h = '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th><input type="checkbox" onchange="adminUpstreamCheckAll(this.checked)"></th><th>上游 ID</th><th>名称</th><th>成本</th><th>库存</th><th>激活</th><th>售价预览</th></tr></thead><tbody>';
    for (var i = 0; i < filtered.length; i++){ var up = filtered[i]; var cost = Number(up.cost || up.cost_price || up.price || 0) || 0; var sell = Math.round((cost * markup + fixed) * 100) / 100; var inSt = (up.inStock === false || up.in_stock === 0) ? '<span class="spill red">缺货</span>' : '<span class="spill green">有货</span>'; var reqAct = (up.requiresEmailActivation === true || up.requires_email_activation === true || up.activation === true) ? '是' : '否';
      h += '<tr><td data-label="选择"><input type="checkbox" class="up-check" data-id="' + escH(String(up.id)) + '" onchange="adminUpstreamPreview()"></td><td data-label="上游 ID"><span class="adm-mono">' + escH(String(up.id)) + '</span></td><td data-label="名称">' + escH(up.title || up.name || '') + '</td><td data-label="成本">' + cost.toFixed(2) + ' USDT</td><td data-label="库存">' + inSt + '</td><td data-label="激活">' + reqAct + '</td><td data-label="售价预览">' + sell.toFixed(2) + ' USDT</td></tr>';
    }
    h += '</tbody></table></div>';
  }
  var cat = el('upCatalog');
  if (cat) cat.innerHTML = h;
  adminUpstreamPreview();
}
function adminUpstreamCheckAll(checked){
  var boxes = document.querySelectorAll('.up-check');
  for (var i = 0; i < boxes.length; i++) boxes[i].checked = checked;
  adminUpstreamPreview();
}
async function adminUpstreamPreview(){
  var boxes = document.querySelectorAll('.up-check:checked');
  var pv = el('upPreview');
  if (!pv) return;
  if (!boxes.length){ pv.textContent = ''; return; }
  var settings = await api('/api/admin/settings');
  var sv = (settings && settings.settings) || {};
  var markup = Number(sv.upstream_markup || 1.2) || 1.2;
  var fixed = Number(sv.upstream_fixed || 0) || 0;
  var totalCost = 0, totalSell = 0;
  var cat = window._upCatalog || [];
  for (var i = 0; i < boxes.length; i++){
    var id = boxes[i].getAttribute('data-id');
    for (var j = 0; j < cat.length; j++){ if (String(cat[j].id) === String(id)){ var cost = Number(cat[j].cost || cat[j].cost_price || cat[j].price || 0) || 0; totalCost += cost; totalSell += Math.round((cost * markup + fixed) * 100) / 100; break; } }
  }
  pv.textContent = '已选 ' + boxes.length + ' 件：总成本 ' + totalCost.toFixed(2) + ' USDT，售价合计 ' + totalSell.toFixed(2) + ' USDT（售价 = cost × ' + markup + ' + ' + fixed + '）';
}
async function adminUpstreamSync(){
  var btn = el('syncBtn'); setBtnLoading(btn, true);
  var r = await api('/api/admin/upstream/sync', 'POST', {});
  setBtnLoading(btn, false);
  if (!r.ok){ toast(r.error, 'error'); return; }
  toast('同步成功 ' + r.count + ' 件', 'success');
  renderAdminUpstream();
}
async function adminUpstreamBalance(){
  var r = await api('/api/admin/upstream/balance');
  if (!r.ok){ toast(r.error, 'error'); return; }
  var resEl = el('upRes');
  if (resEl) resEl.textContent = '余额：' + JSON.stringify(r.balance);
  toast('余额已更新', 'success');
}
async function adminUpstreamImport(){
  var boxes = document.querySelectorAll('.up-check:checked');
  if (!boxes.length){ toast('请先勾选要导入的上游商品', 'error'); return; }
  var ids = [];
  for (var i = 0; i < boxes.length; i++) ids.push({ id: boxes[i].getAttribute('data-id') });
  showModal({ title: '批量导入上游商品', bodyHTML: '<p>将导入 <b>' + ids.length + '</b> 件商品。重新导入已存在的商品时，不会覆盖标题与简介（保留人工翻译）。确定导入？</p>', confirmText: '确认导入', onConfirm: async function(){
    var r = await api('/api/admin/upstream/import', 'POST', { items: ids });
    if (!r.ok){ toast(r.error, 'error'); return false; }
    toast('导入 ' + r.imported + ' 件（markup ' + r.markup + ' / fixed ' + r.fixed + '）', 'success');
    adminTab('products');
  }});
}
async function adminUpstreamRetry(orderId){
  showModal({ title: '重试上游轮询', bodyHTML: '<p>将对该订单重新执行上游轮询（已有上游单号时只轮询状态，无单号时用同一 Idempotency-Key 重试下单，不会重复扣费）。确定重试？</p>', confirmText: '确认重试', showInput: true, inputLabel: '重试原因（可选，记入审计）', inputPlaceholder: '如：上游已充值，重新轮询', onConfirm: async function(reason){
    var r = await api('/api/admin/upstream/orders/' + orderId + '/retry', 'POST', { reason: reason || '' });
    if (!r.ok){ toast(r.error, 'error'); return false; }
    toast('重试已执行', 'success');
    renderAdminUpstream();
  }});
}
// ---- 系统设置 ----
function adminSettingField(sv, k, label, rows, hint){
  return '<div class="adm-field"><label>' + escH(label) + '（' + k + '）</label><textarea data-sk="' + k + '" rows="' + (rows || 2) + '">' + escH(sv[k] || '') + '</textarea>' + (hint ? '<div class="hint">' + escH(hint) + '</div>' : '') + '</div>';
}
function adminSettingInput(sv, k, label, hint, type){
  return '<div class="adm-field"><label>' + escH(label) + '（' + k + '）</label><input data-sk="' + k + '" type="' + (type || 'text') + '" value="' + escH(sv[k] || '') + '">' + (hint ? '<div class="hint">' + escH(hint) + '</div>' : '') + '</div>';
}
async function renderAdminSettings(){
  var sr = await api('/api/admin/settings');
  if (!sr.ok){ el('adminBody').innerHTML = '<div class="adm-empty">加载失败：' + escH(sr.error) + '</div>'; return; }
  var sv = sr.settings || {};
  var h = '<div class="admin-page"><div class="admin-page-head"><h2>系统设置</h2></div>';
  h += '<p class="muted">JSON 配置保存前会校验结构与字段，错误时会指出具体字段，不会静默保存无效配置。未修改的配置不会因界面未展示字段而被清空。敏感密钥请走 Secrets，不要写进设置。</p>';
  h += '<div class="adm-card"><h3>基础设置</h3>' + adminSettingInput(sv, 'site_name', '站点名称', '前台显示的站名') + adminSettingField(sv, 'announcement', '公告', 2, '前台顶部公告') + adminSettingField(sv, 'order_notice', '下单须知', 3, '显示在商品详情页') + adminSettingInput(sv, 'tg_link', '客服 / TG 链接', '必须是 http(s) 开头的 URL') + '</div>';
  h += '<div class="adm-card"><h3>收款设置</h3>' + adminSettingField(sv, 'usdt_addresses', '收款地址 JSON', 4, '键必须是“支付方式|链”格式，如 Binance|X Layer，值是收款地址') + adminSettingInput(sv, 'binance_uid', '币安 UID', '纯数字，币安 UID 站内转账的收款 UID') + adminSettingField(sv, 'pay_tutorials', '支付教程 JSON', 2, '键是支付方式，值是教程 URL') + '</div>';
  h += '<div class="adm-card"><h3>链上到账轮询</h3>' + adminSettingInput(sv, 'poll_enabled', '轮询开关', '1 开 / 0 关（关了只走手动 TXID / 管理员确认）') + adminSettingField(sv, 'rpc_urls', 'RPC 地址 JSON', 3, '键是链，值是 URL 数组，如 {"X Layer":["https://xlayerrpc.okx.com"]}') + adminSettingField(sv, 'usdt_contracts', 'USDT 合约 JSON', 3, '键是链，值是合约地址') + '</div>';
  h += '<div class="adm-card"><h3>上游与汇率</h3>' + adminSettingInput(sv, 'prodseller_base_url', '上游 Base URL', 'Env 优先于此设置') + adminSettingInput(sv, 'upstream_markup', '上游加价倍率', '导入售价 = cost × markup + fixed，默认 1.2', 'number') + adminSettingInput(sv, 'upstream_fixed', '上游固定加价', '默认 0', 'number') + adminSettingInput(sv, 'cny_rate', 'CNY 汇率', '前台 CNY 展示汇率，当前 7.2', 'number') + '</div>';
  h += '<div><button class="btn" id="saveSettingsBtn" onclick="adminSaveSettings()">保存设置</button></div></div>';
  el('adminBody').innerHTML = h;
}
async function adminSaveSettings(){
  var obj = {};
  var tas = document.querySelectorAll('[data-sk]');
  for (var i = 0; i < tas.length; i++) obj[tas[i].getAttribute('data-sk')] = tas[i].value;
  // 前端先做一层 JSON 校验，错误时指出字段，不发请求
  var jsonKeys = ['usdt_addresses', 'pay_tutorials', 'rpc_urls', 'usdt_contracts'];
  for (var j = 0; j < jsonKeys.length; j++){
    var k = jsonKeys[j];
    if (obj[k] !== undefined) { try { var parsed = JSON.parse(obj[k] || '{}'); if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('x'); } catch (e) { toast('设置 ' + k + ' 不是合法 JSON 对象', 'error'); return; } }
  }
  var btn = el('saveSettingsBtn'); setBtnLoading(btn, true);
  var r = await api('/api/admin/settings', 'POST', { settings: obj });
  setBtnLoading(btn, false);
  if (!r.ok){ toast(r.error, 'error'); return; }
  toast('已保存', 'success');
}
// ---- 操作审计 ----
window._auditFilter = { action: '', order_id: '', page: 1 };
async function renderAdminAudit(page){
  var f = window._auditFilter;
  f.page = page || 1;
  var qs = '/api/admin/audit?page=' + f.page + '&page_size=20';
  if (f.action) qs += '&action=' + encodeURIComponent(f.action);
  if (f.order_id) qs += '&order_id=' + encodeURIComponent(f.order_id);
  var r = await api(qs);
  if (!r.ok){ el('adminBody').innerHTML = '<div class="adm-empty">加载失败：' + escH(r.error) + '</div>'; return; }
  var list = r.audit || [];
  function selOpts3(opts, cur){ var h = ''; for (var i = 0; i < opts.length; i++) h += '<option value="' + opts[i][0] + '"' + (String(cur) === String(opts[i][0]) ? ' selected' : '') + '>' + opts[i][1] + '</option>'; return h; }
  var h = '<div class="admin-page"><div class="admin-page-head"><h2>操作审计</h2></div>';
  h += '<p class="muted">记录确认收款、人工发货、订单取消、上游重试、配置修改等关键操作。审计不记录密码、查单凭证、完整卡密、API Key。</p>';
  h += '<div class="admin-toolbar"><select id="auditAction" onchange="adminAuditSearch()">' + selOpts3([['', '全部操作'], ['confirm_payment', '确认收款'], ['fulfill', '人工发货'], ['cancel', '取消订单'], ['upstream_retry', '上游重试'], ['settings_update', '配置修改'], ['product_delete', '删除商品'], ['auto_cancel_timeout', '超时自动取消']], f.action) + '</select><input id="auditOrderId" placeholder="按订单 ID 筛选" value="' + escH(f.order_id) + '" onkeydown="if(event.key===\'Enter\')adminAuditSearch()"><button class="btn" onclick="adminAuditSearch()">搜索</button><button class="btn ghost" onclick="adminAuditReset()">重置</button></div>';
  if (!list.length) h += '<div class="adm-empty">暂无审计记录</div>';
  else {
    h += '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>时间</th><th>订单 ID</th><th>操作</th><th>状态变化</th><th>说明</th></tr></thead><tbody>';
    for (var i = 0; i < list.length; i++){ var a = list[i];
      h += '<tr><td data-label="时间">' + escH(fmtTime(a.created_at)) + '</td><td data-label="订单 ID">' + (a.order_id != null ? a.order_id : '—') + '</td><td data-label="操作">' + escH(a.action) + '</td><td data-label="状态变化">' + escH(a.before_status || '-') + ' → ' + escH(a.after_status || '-') + '</td><td data-label="说明">' + escH(a.note || '') + '</td></tr>';
    }
    h += '</tbody></table></div>';
    h += paginationHTML(r.page || 1, r.total_pages || 1, 'renderAdminAudit');
  }
  h += '</div>';
  el('adminBody').innerHTML = h;
}
function adminAuditSearch(){
  var f = window._auditFilter;
  f.action = el('auditAction') ? el('auditAction').value : '';
  f.order_id = el('auditOrderId') ? el('auditOrderId').value.trim() : '';
  renderAdminAudit(1);
}
function adminAuditReset(){ window._auditFilter = { action: '', order_id: '', page: 1 }; renderAdminAudit(1); }


load();
