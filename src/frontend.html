<style>
/* 凌策淡蓝（浅色主主题）。字体只用系统栈，不引外部字体 CDN。 */
:root{
  --zx-bg:#eef5fa;--zx-bg-muted:#f3f6f8;--zx-bg-auth:#e9f1f7;
  --zx-surface:#ffffff;--zx-surface-2:rgba(255,255,255,.72);--zx-surface-3:rgba(255,255,255,.92);
  --zx-text:#17345b;--zx-text-strong:#102b57;--zx-muted:#486487;--zx-on-accent:#ffffff;
  --zx-accent:#246bd5;--zx-accent-strong:#1761d3;--zx-blue:#347ce7;--zx-success:#087f6b;
  --zx-border:rgba(85,129,178,.15);--zx-border-solid:#c5d6e8;
  --zx-shadow-sm:0 1px 2px rgba(16,43,87,.06);--zx-shadow-md:0 8px 24px rgba(16,43,87,.08);--zx-shadow-lg:0 16px 40px rgba(23,52,91,.12);--zx-shadow-pill:0 8px 28px rgba(36,107,213,.18);
  --zx-radius-sm:10px;--zx-radius-md:16px;--zx-radius-lg:20px;--zx-radius-xl:24px;--zx-radius-pill:999px;
  --zx-font:"Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --zx-glass-blur:16px;
  --bg:var(--zx-bg);--card:var(--zx-surface-2);--card2:var(--zx-surface-3);--text:var(--zx-text);--sub:var(--zx-muted);--line:var(--zx-border);--accent:var(--zx-accent);--green:#34c759;--orange:#9a5b00;--red:#b42318;--radius:24px;
  color-scheme:light
}
@media (prefers-color-scheme:dark){html:not([data-theme]){--bg:#000;--card:rgba(28,28,30,.62);--card2:rgba(44,44,46,.85);--text:#f5f5f7;--sub:#a1a1aa;--line:rgba(255,255,255,.14);--red:#ff7b73;--orange:#ff9f0a;--zx-surface:rgba(44,44,46,.72);--zx-text-strong:#f5f5f7;--zx-bg-muted:#1c1c1e;color-scheme:dark}html:not([data-theme]) .pcard-btn{background:rgba(48,209,88,.28);color:#7be3a8}html:not([data-theme]) .pcard-btn:disabled{background:rgba(255,69,58,.28);color:#ff9d97}}
html[data-theme="dark"]{--bg:#000;--card:rgba(28,28,30,.62);--card2:rgba(44,44,46,.85);--text:#f5f5f7;--sub:#a1a1aa;--line:rgba(255,255,255,.14);--red:#ff7b73;--orange:#ff9f0a;--zx-surface:rgba(44,44,46,.72);--zx-text-strong:#f5f5f7;--zx-bg-muted:#1c1c1e;color-scheme:dark}
html[data-theme="dark"] .pcard-btn{background:rgba(48,209,88,.28);color:#7be3a8}html[data-theme="dark"] .pcard-btn:disabled{background:rgba(255,69,58,.28);color:#ff9d97}
html[data-theme="dark"] .pcard-img{background:#1c1c1e}
html[data-theme="dark"] .prod-img{background:#1c1c1e}
html[data-theme="dark"] .detail-img-photo{background:#1c1c1e}
@media (prefers-color-scheme:dark){html:not([data-theme]) .pcard-img,html:not([data-theme]) .prod-img,html:not([data-theme]) .detail-img-photo{background:#1c1c1e}html:not([data-theme]) .home-h1-accent,html:not([data-theme]) .home-section-star,html:not([data-theme]) .home-eyebrow b,html:not([data-theme]) .ic{color:#8ea6ff}html:not([data-theme]) .pcard-btn:disabled{background:rgba(255,69,58,.28);color:#ff9d97}html:not([data-theme]) .pcard-btn-soldout{background:rgba(255,69,58,.28)!important;color:#ff9d97!important}html:not([data-theme]) .captcha-img{background:#2c2c2e!important}}
html[data-theme="dark"] .pcard-btn:disabled{background:rgba(255,69,58,.28);color:#ff9d97}
html[data-theme="dark"] .pcard-btn-soldout{background:rgba(255,69,58,.28)!important;color:#ff9d97!important}
html[data-theme="dark"] .captcha-img{background:#2c2c2e!important}
.captcha-img{background:#f3f6f8}
*{box-sizing:border-box}
body{margin:0;font-family:var(--zx-font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
html:not([data-theme="dark"]) body{background:radial-gradient(1000px 480px at 0% -8%,rgba(52,124,231,.18),transparent 58%),radial-gradient(820px 420px at 100% 0%,rgba(36,107,213,.12),transparent 52%),var(--bg)}
@media (prefers-color-scheme:dark){html:not([data-theme]) body{background:var(--bg)}}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 80px}
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:18px;text-decoration:none;color:var(--text);cursor:pointer}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;background:rgba(127,127,127,.12);color:var(--text);font-size:13px}
.nav a.nav-icon{font-size:16px;line-height:1;padding:8px 11px}
.theme-btn{border:0;padding:8px 12px;border-radius:999px;background:rgba(127,127,127,.12);color:var(--text);font-size:14px;cursor:pointer;line-height:1}
.glass{background:var(--card);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.08);padding:18px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.pay-shell{max-width:520px;margin-left:auto;margin-right:auto}
.pay-amount{margin:14px 0 6px}
.pay-amount-usdt{font-size:34px;font-weight:800;color:var(--green);line-height:1.1}
.pay-amount-sub{color:var(--sub);font-size:13px;margin-top:6px}
.pay-copy{border:0;background:transparent;cursor:pointer;font-size:15px;color:var(--sub);padding:2px 6px;line-height:1}
.pay-copy:hover{color:var(--text)}
.pay-toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.pay-exact{display:inline-flex;align-items:center;gap:6px;background:rgba(36,107,213,.10);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pay-deadline{display:flex;flex-direction:column;align-items:flex-end;gap:2px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--card2);text-align:right}
.pay-deadline-abs{font-size:12px;color:var(--sub)}
.pay-deadline-left{font-size:14px;font-weight:700}
.pay-deadline-expired{border-color:rgba(255,69,58,.5);background:rgba(255,69,58,.10)}
.pay-deadline-expired .pay-deadline-left{color:var(--red)}
.pay-div{border-top:1px solid var(--line);margin:12px 0}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin:10px 0}
.pay-row-label{color:var(--sub)}
.pay-row-value{display:flex;align-items:center;gap:6px}
.pay-row-value b{color:var(--text);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
.pay-qr-box{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;justify-content:center;background:rgba(255,255,255,.85);margin:14px 0}
.pay-addrbox{background:rgba(127,127,127,.10);border-radius:16px;padding:12px 14px;margin:12px 0}
.pay-addr-head{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:13px;margin-bottom:6px}
.pay-addr{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:14px;line-height:1.6}
.pay-qr{position:relative;width:180px;height:180px;margin:14px 0}
.pay-qr img,.pay-qr canvas{width:180px;height:180px;border-radius:12px;background:#fff;display:block}.pay-qr-err{width:180px;min-height:180px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;box-sizing:border-box;font-size:12px;color:#b45309}
.pay-qr-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#26a17b;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.pay-qr-logo svg{display:block}
.pay-addr-hl{color:var(--green);font-weight:700}
.home-hero{display:flex;gap:24px;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:28px;padding:36px 36px 28px;margin:8px 0 16px;overflow:hidden;position:relative}
.home-eyebrow{color:var(--sub);font-size:14px;font-weight:600;margin-bottom:14px}
.home-eyebrow b{color:var(--zx-accent);font-weight:700}
.home-h1{font-size:52px;line-height:1.15;font-weight:800;letter-spacing:-.5px;margin:0 0 16px}
.home-h1-accent{color:#5b7bff}
.home-sub{color:var(--sub);font-size:16px;line-height:1.7;max-width:460px;margin:0 0 24px}
.home-cta{border:0;background:#5b7bff;color:#fff;font-size:16px;font-weight:700;padding:14px 24px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.home-cta:hover{background:var(--zx-accent-strong)}
#shopBrowse{scroll-margin-top:72px}
.home-note{color:var(--sub);font-size:13px;margin-top:16px}
.home-visual{position:relative;width:420px;height:320px;flex:0 0 auto}
.home-visual-scale{position:relative;width:100%;height:100%}
.home-visual-ring{position:absolute;border:1px solid rgba(36,107,213,.22);border-radius:50%}

.adm-field .hint{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.adm-field .err{font-size:12px;color:var(--red);margin-top:4px}
.adm-field.invalid input,.adm-field.invalid textarea,.adm-field.invalid select{border-color:var(--red)}
/* Toast / Modal / Drawer */
.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:420px;padding:0 14px}
.toast{background:#1c1c1e;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:100%;word-break:break-word;text-align:center}
.toast.success{background:#1e7a34}
.toast.error{background:#c81e1e}
.toast.warn{background:#8a5a00}
html[data-theme="light"] .toast{background:#1c1c1e;color:#fff}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card2);border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;overflow-x:hidden;box-shadow:0 16px 60px rgba(0,0,0,.25)}
@media(max-width:720px){.modal-backdrop.modal-fullbleed .modal{padding-left:0;padding-right:0}.modal-backdrop.modal-fullbleed .modal h3{padding:0 20px}.modal-backdrop.modal-fullbleed .modal-actions{padding:0 20px}}
.modal h3{font-size:17px;margin:0 0 10px}
.modal .modal-body{font-size:14px;line-height:1.7;color:var(--text)}
.modal .modal-body .muted{font-size:13px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:var(--card2);z-index:151;overflow-y:auto;padding:20px;box-shadow:-8px 0 40px rgba(0,0,0,.2)}
.drawer h3{font-size:17px;margin:0 0 12px}
.drawer .drawer-close{position:absolute;top:14px;right:14px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--sub)}
.drawer-section{margin:14px 0;padding-top:12px;border-top:1px solid rgba(127,127,127,.18)}
.drawer-section h4{font-size:13px;color:var(--sub);margin:0 0 8px}
.drawer-kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;line-height:1.6}
.drawer-kv .k{color:var(--sub)}
.drawer-kv .v{word-break:break-all}
.btn.loading{opacity:.6;pointer-events:none}
.btn.loading::after{content:' …'}
.skeleton{background:linear-gradient(90deg,rgba(127,127,127,.12),rgba(127,127,127,.22),rgba(127,127,127,.12));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:16px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

.ic{display:inline-block;width:1em;height:1em;vertical-align:-0.15em;flex:none;color:var(--zx-accent)}

async function submitTxid(no){

  var tx = txEl ? txEl.value.trim() : '';
  if (!tx){ toast('请先填写 TXID（不填可直接等待自动发货）', 'error'); return; }
  if (tx.length < 6 || tx.length > 200){ toast('TXID 长度无效（6-200字符）', 'error'); return; }
  if (!/^[A-Za-z0-9_-]+$/.test(tx)){ toast('TXID 仅支持字母数字 _ -', 'error'); return; }
  var body = { txid: tx };

  if (tsFailClosed()){ toast('反机器人验证未配置（Site Key 缺失），请联系管理员', 'error'); return; }
  if (tsEnabled()) {
    var tok = tsToken(scope);
    if (!tok){ toast('请完成反机器人验证', 'error'); return; }
    body.turnstile_token = tok;

    var capInput = el('payCaptchaCode-' + no) || el('payCaptchaCode');
    if (capInput) {
      var capCode = capInput.value.trim();
      if (!capCode){ toast('请填写图形验证码', 'error'); return; }
      body.captcha_id = (window._payCaptchaIds && window._payCaptchaIds[no]) || window._payCaptchaId || '';
      body.captcha_code = capCode;
    }
  }
  var r = await api('/api/orders/' + encodeURIComponent(no) + '/pay', 'POST', body);
  if (!r.ok){
    toast(r.error, 'error');
    if ((r.error || '').indexOf('验证码') !== -1) { if (el('payCaptchaCode-' + no)) loadPayCaptchaFor(no); else loadPayCaptcha(); }

    return;
  }
  // P2-8：成功后清空 TXID 输入 + 清已消费验证码并加载新验证码（各订单刷新自己的）；Turnstile 走 Token 重置。

}

function previewTemplateSell(cost, tpl){
  var markup = Number(tpl && tpl.markup);
  var fixed = Number(tpl && (tpl.fixed != null ? tpl.fixed : tpl.fixed_add));
  if (!isFinite(markup) || markup <= 0) markup = 1;
  if (!isFinite(fixed)) fixed = 0;
  var sell = Math.round(((Number(cost) || 0) * markup + fixed) * 100) / 100;
  if (tpl && tpl.price_floor != null && tpl.price_floor !== '' && isFinite(Number(tpl.price_floor)) && sell < Number(tpl.price_floor)) sell = Number(tpl.price_floor);
  if (tpl && tpl.price_ceiling != null && tpl.price_ceiling !== '' && isFinite(Number(tpl.price_ceiling)) && sell > Number(tpl.price_ceiling)) sell = Number(tpl.price_ceiling);
  if (!isFinite(sell) || sell < 0) sell = 0;
  if (sell > 1000000) sell = 1000000;
  return Math.round(sell * 100) / 100;
}

function handleProductImage(file, pfx){
  if (!file) return;
  if (file.type.indexOf('image/') !== 0){ toast('请选择图片文件', 'error'); return; }
  if (file.size > 2 * 1024 * 1024){ toast('图片不能超过 2MB', 'error'); return; }
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      var cv = document.createElement('canvas'); cv.width = 800; cv.height = 800;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, 800, 800);
      var url = cv.toDataURL('image/jpeg', 0.82);
      if (url.length > 700000) url = cv.toDataURL('image/jpeg', 0.6);
      if (url.length > 700000){ toast('图片压缩后仍超过 500KB，请换一张更小的图', 'error'); return; }
      window._productImage = window._productImage || {};
      window._productImage[pfx] = url;
      window._productImgMode = window._productImgMode || {};
      window._productImgMode[pfx] = 'upload';
      var pv = el(pfx + 'imgpv');
      if (pv) pv.innerHTML = '<img src="' + url + '" style="width:120px;height:120px;object-fit:cover;border-radius:16px">';
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

    h += '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>时间</th><th>订单 ID</th><th>操作</th><th>状态变化</th><th>说明</th></tr></thead><tbody>';
    for (var i = 0; i < list.length; i++){ var a = list[i];
      h += '<tr><td data-label="时间">' + escH(fmtTime(a.created_at)) + '</td><td data-label="订单 ID">' + (a.order_id != null ? a.order_id : '—') + '</td><td data-label="操作">' + escH(a.action) + '</td><td data-label="状态变化">' + escH(a.before_status || '-') + ' → ' + escH(a.after_status || '-') + '</td><td data-label="说明">' + escH(a.note || '') + '</td></tr>';
    }
    h += '</tbody></table></div>';
    h += paginationHTML(r.page || 1, r.total_pages || 1, 'renderAdminAudit');
  }
  h += '</div>';
  el('adminBody').innerHTML = h;
}
function adminAuditSearch(){
  var f = window._auditFilter;
  f.action = el('auditAction') ? el('auditAction').value : '';
  f.order_id = el('auditOrderId') ? el('auditOrderId').value.trim() : '';
  renderAdminAudit(1);
}
function adminAuditReset(){ window._auditFilter = { action: '', order_id: '', page: 1 }; renderAdminAudit(1); }

async function renderAdminCategories(){
  var r = await api('/api/admin/categories');
  if (!r.ok){ el('adminBody').innerHTML = '<div class="adm-empty">加载失败：' + escH(r.error) + '</div>'; return; }
  window._adminCategories = r.categories || [];
  var list = window._adminCategories;
  var h = '<div class="admin-page"><div class="admin-page-head"><h2>商品分类</h2><button class="btn" onclick="adminCategoryForm(null)">+ 新增分类</button></div>';
  h += '<p class="muted">扁平目录。内置代充 / 成品号 / 卡密的标识不能改（发货规则绑定）。停用后不能用于新商品，已有商品保留原标识。</p>';
  if (!list.length) h += '<div class="adm-empty">暂无分类</div>';
  else {
    h += '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>标识</th><th>名称</th><th>排序</th><th>状态</th><th></th></tr></thead><tbody>';
    for (var i = 0; i < list.length; i++){
      var c = list[i];
      h += '<tr><td data-label="标识"><span class="adm-mono">' + escH(c.key) + '</span>' + (c.builtin ? ' <span class="spill gray">内置</span>' : '') + '</td><td data-label="名称">' + escH(c.name) + '</td><td data-label="排序">' + c.sort + '</td><td data-label="状态">' + (Number(c.is_active) ? '<span class="spill green">启用</span>' : '<span class="spill gray">停用</span>') + '</td><td data-label=""><button class="btn small ghost" data-id="' + c.id + '" onclick="adminCategoryForm(this.dataset.id)">改名</button> ' + (Number(c.is_active) ? '<button class="btn small" data-id="' + c.id + '" onclick="adminCategoryActive(this.dataset.id,0)">停用</button>' : '<button class="btn small" data-id="' + c.id + '" onclick="adminCategoryActive(this.dataset.id,1)">启用</button>') + '</td></tr>';
    }
    h += '</tbody></table></div>';
  }
  h += '</div>';
  el('adminBody').innerHTML = h;
}
function adminCategoryForm(id){
  var c = null;
  var list = window._adminCategories || [];
  for (var i = 0; i < list.length; i++){ if (String(list[i].id) === String(id)) c = list[i]; }
  var body = '<div class="adm-field"><label>名称</label><input id="catName" value="' + escH(c ? c.name : '') + '"></div>';
  if (!c) body += '<div class="adm-field"><label>标识（可留空自动生成）</label><input id="catKey" placeholder="如 vip_pack"></div>';
  else if (!c.builtin) body += '<div class="adm-field"><label>标识</label><input id="catKey" value="' + escH(c.key) + '"><div class="hint">修改标识会同步已有商品的分类。</div></div>';
  else body += '<p class="muted">内置标识 ' + escH(c.key) + ' 不可修改。</p>';
  body += '<div class="adm-field"><label>排序</label><input id="catSort" type="number" value="' + (c ? c.sort : 100) + '"></div>';
  showModal({ title: c ? '编辑分类' : '新增分类', bodyHTML: body, confirmText: '保存', onConfirm: async function(){
    var name = (el('catName').value || '').trim();
    if (!name){ toast('名称必填', 'error'); return false; }
    var payload = { name: name, sort: Number(el('catSort').value || 100) };
    if (el('catKey')) payload.key = (el('catKey').value || '').trim();
    var r = c ? await api('/api/admin/categories/' + c.id, 'PUT', payload) : await api('/api/admin/categories', 'POST', payload);
    if (!r.ok){ toast(r.error, 'error'); return false; }
    toast('已保存', 'success');
    renderAdminCategories();
  }});
}
function adminCategoryActive(id, on){
  var path = '/api/admin/categories/' + id + (on ? '/activate' : '/deactivate');
  api(path, 'POST', {}).then(function(r){
    if (!r.ok){ toast(r.error, 'error'); return; }
    toast(on ? '已启用' : '已停用', 'success');
    renderAdminCategories();
  });
}

function pricingAdvancedHTML(list){
  var h = '<div class="adm-card" id="pricingAdvanced"><h3>高级：定价模板</h3>';
  h += '<div class="row" style="margin-bottom:8px"><p class="muted" style="margin:0;flex:1">售价 = 成本 × 倍率 + 固定加价，再夹到可选下限/上限。导入新商品可用模板；重新导入不覆盖已保存售价。显式「按成本填入售价」并保存才会改价。</p><button class="btn small" onclick="adminPricingForm(null)">+ 新增模板</button></div>';
  if (!list.length) h += '<div class="adm-empty">暂无模板。未选模板时导入仍用系统设置里的全局倍率。</div>';
  else {
    h += '<div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>名称</th><th>倍率</th><th>固定</th><th>下限</th><th>上限</th><th>状态</th><th></th></tr></thead><tbody>';
    for (var i = 0; i < list.length; i++){
      var t = list[i];
      h += '<tr><td data-label="名称">' + escH(t.name) + '</td><td data-label="倍率">' + escH(t.markup) + '</td><td data-label="固定">' + escH(t.fixed) + '</td><td data-label="下限">' + (t.price_floor == null ? '—' : escH(t.price_floor)) + '</td><td data-label="上限">' + (t.price_ceiling == null ? '—' : escH(t.price_ceiling)) + '</td><td data-label="状态">' + (Number(t.is_active) ? '<span class="spill green">启用</span>' : '<span class="spill gray">停用</span>') + '</td><td data-label=""><button class="btn small ghost" data-id="' + escH(t.id) + '" onclick="adminPricingForm(this.dataset.id)">编辑</button>' + (Number(t.is_active) ? ' <button class="btn small" data-id="' + escH(t.id) + '" onclick="adminPricingOff(this.dataset.id)">停用</button>' : '') + '</td></tr>';
    }
    h += '</tbody></table></div>';
  }
  h += '</div>';
  return h;
}
async function renderAdminPricing(){
  window._adminTab = 'upstream';
  await renderAdminUpstream();
}
function adminPricingForm(id){
  var t = null;
  var list = window._adminTemplates || [];
  for (var i = 0; i < list.length; i++){ if (String(list[i].id) === String(id)) t = list[i]; }
  function fld(fid, label, val){ return '<div class="adm-field"><label>' + label + '</label><input id="' + fid + '" value="' + escH(val == null ? '' : val) + '"></div>'; }
  var body = fld('ptName', '名称', t ? t.name : '') + fld('ptMarkup', '倍率（1.2 = 成本×1.2）', t ? t.markup : '1.2') + fld('ptFixed', '固定加价', t ? t.fixed : '0') + fld('ptFloor', '控价下限（可空）', t ? t.price_floor : '') + fld('ptCeil', '控价上限（可空）', t ? t.price_ceiling : '');
  showModal({ title: t ? '编辑定价模板' : '新增定价模板', bodyHTML: body, confirmText: '保存', onConfirm: async function(){
    var payload = { name: (el('ptName').value || '').trim(), markup: el('ptMarkup').value, fixed: el('ptFixed').value, price_floor: el('ptFloor').value, price_ceiling: el('ptCeil').value };
    if (t) payload.is_active = t.is_active;
    var r = t ? await api('/api/admin/pricing-templates/' + t.id, 'PUT', payload) : await api('/api/admin/pricing-templates', 'POST', payload);
    if (!r.ok){ toast(r.error, 'error'); return false; }
    toast(r.idempotent ? '模板已存在' : '已保存', 'success');
    renderAdminUpstream();
  }});
}
function adminPricingOff(id){
  api('/api/admin/pricing-templates/' + id + '/deactivate', 'POST', {}).then(function(r){
    if (!r.ok){ toast(r.error, 'error'); return; }
    toast('已停用', 'success');
    renderAdminUpstream();
  });
}

load();
</script>
</body>
</html>
