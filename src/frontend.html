<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智选</title>
<style>
:root{--bg:#f2f2f7;--card:rgba(255,255,255,.68);--card2:rgba(255,255,255,.9);--text:#1c1c1e;--sub:#6b7280;--line:rgba(255,255,255,.6);--accent:#0a84ff;--green:#34c759;--orange:#ff9f0a;--red:#ff453a;--radius:24px}
@media (prefers-color-scheme:dark){html:not([data-theme]){--bg:#000;--card:rgba(28,28,30,.62);--card2:rgba(44,44,46,.85);--text:#f5f5f7;--sub:#a1a1aa;--line:rgba(255,255,255,.14)}html:not([data-theme]) .pcard-btn{background:rgba(109,92,255,.28);color:#b7adff}}
html[data-theme="dark"]{--bg:#000;--card:rgba(28,28,30,.62);--card2:rgba(44,44,46,.85);--text:#f5f5f7;--sub:#a1a1aa;--line:rgba(255,255,255,.14)}
html[data-theme="dark"] .pcard-btn{background:rgba(109,92,255,.28);color:#b7adff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 80px}
.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:18px;text-decoration:none;color:var(--text);cursor:pointer}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;background:rgba(127,127,127,.12);color:var(--text);font-size:13px}
.nav a.nav-icon{font-size:16px;line-height:1;padding:8px 11px}
.theme-btn{border:0;padding:8px 12px;border-radius:999px;background:rgba(127,127,127,.12);color:var(--text);font-size:14px;cursor:pointer;line-height:1}
.glass{background:var(--card);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.08);padding:18px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.h1{font-size:26px;font-weight:800;margin:6px 0 4px}
.h2{font-size:18px;font-weight:700;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.shop-grid{grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.shop-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.pcard-cat{display:none}}
.card{cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.pcard{padding:12px;display:flex;flex-direction:column;min-width:0;box-shadow:none;border-radius:20px}
.pcard-img{position:relative;background:#fff;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;margin-bottom:12px}
.pcard-img img{max-width:82%;max-height:82%;object-fit:contain}
.pcard-img .emoji{font-size:56px}
.pcard-arrow{position:absolute;top:10px;right:12px;font-size:18px;color:var(--sub)}
.pcard-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.stock-dot{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600}
.stock-dot:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.stock-dot.out{color:var(--red)}
.stock-dot.out:before{background:var(--red)}
.pcard-title{font-size:16px;font-weight:700;margin:10px 0 6px;line-height:1.4}
.pcard-desc{color:var(--sub);font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;overflow-wrap:anywhere}
.pcard-foot{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(127,127,127,.15)}
.pcard-price-label{font-size:11px;color:var(--sub)}
.pcard-price{font-size:24px;font-weight:800;line-height:1.2}
.pcard-btn{border:0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#e8e4ff;color:#6d5cff;white-space:nowrap;text-align:center}
.pcard-btn:disabled{background:rgba(127,127,127,.15);color:var(--sub);cursor:not-allowed}
.emoji{font-size:34px}
.price{font-size:22px;font-weight:800;margin:8px 0 2px}
.badge{display:inline-block;font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(10,132,255,.14);color:var(--accent)}

.badge-share{cursor:pointer;border:0;font-family:inherit}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid rgba(127,127,127,.25);background:var(--card2);color:var(--text);font-size:15px;outline:none}
label{font-size:13px;color:var(--sub);display:block;margin:12px 0 6px}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table{width:100%;border-collapse:collapse;font-size:13px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

.sort-sel{width:auto;min-width:215px;flex:0 0 auto;cursor:pointer}

.notice{white-space:pre-wrap}
.footer{margin-top:28px;text-align:center}
.breadcrumb{font-size:13px;color:var(--sub);margin:4px 0 12px}

.detail-hero{display:flex;gap:16px;align-items:flex-start}

.detail-price{font-size:30px;font-weight:800;margin:10px 0 2px}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.detail-section{margin-top:16px}
.detail-section h3{font-size:15px;margin:0 0 8px}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.step{background:rgba(127,127,127,.08);border-radius:16px;padding:12px}
.step b{display:block;margin-bottom:4px}
.qty-row{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.qty-btn{width:44px;border:0;background:var(--accent);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.qty-input{width:64px;text-align:center;border:0;background:transparent;font-size:16px;font-weight:700;color:var(--text);padding:10px 0}
.total-box{display:flex;justify-content:space-between;align-items:center;background:rgba(10,132,255,.08);border:1px solid rgba(10,132,255,.2);border-radius:16px;padding:12px 14px;margin-top:14px}
.sticky-buy{position:sticky;bottom:12px;margin-top:16px;background:var(--card2);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.related{margin-top:18px}
.detail-top{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
@media(max-width:720px){.detail-top{grid-template-columns:1fr}}
.detail-img{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:380px;font-size:120px;background:var(--card2);border-radius:var(--radius);text-align:center;padding:24px;position:relative}
@media(max-width:720px){.detail-img{min-height:240px;font-size:88px}}
.detail-img-cap{font-size:17px;font-weight:700;line-height:1.5;max-width:100%}
.detail-tabs{display:flex;gap:18px;border-bottom:1px solid rgba(127,127,127,.2);margin-bottom:14px}
.detail-tabs span{font-size:16px;font-weight:700;padding:10px 2px;border-bottom:3px solid var(--accent);margin-bottom:-1px}
.buy-box{position:sticky;top:64px}
@media(max-width:720px){.buy-box{position:static}}
.buy-price{font-size:32px;font-weight:800;color:var(--red);margin:6px 0 2px}
.buy-price small{font-size:13px;color:var(--sub);font-weight:400}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.pay-options{align-items:center}
.pay-logo{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.pay-card{background:var(--card2);border-radius:14px;padding:12px 14px;margin:6px 0}
.pay-card-title{font-weight:700;font-size:15px;margin-bottom:10px;color:var(--accent)}
.pill{padding:8px 12px;border-radius:999px;border:1.5px solid rgba(127,127,127,.3);background:var(--card2);cursor:pointer;font-size:13px;color:var(--text)}
.pill.on{border-color:var(--accent);background:rgba(10,132,255,.14);color:var(--accent);font-weight:700}

.detail-blocks{margin-top:18px}
.detail-block{border-left:4px solid var(--accent);background:var(--card);border-radius:0 16px 16px 0;padding:14px 16px;margin:12px 0}
.detail-block.green{border-color:var(--green)}
.detail-block.orange{border-color:var(--orange)}
.detail-block.red{border-color:var(--red)}
.detail-block h3{margin:0 0 8px;font-size:15px}
.detail-block p{margin:0;font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap}
.warn-box{background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.3);border-radius:16px;padding:12px}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:720px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat-card .num{font-size:26px;font-weight:800;margin-top:4px}
.stat-card .lbl{font-size:13px;color:var(--sub)}
.stat-card.warn .num{color:var(--orange)}
.stat-card.bad .num{color:var(--red)}
.stat-card.good .num{color:var(--green)}
.seg{display:flex;gap:6px;flex-wrap:wrap;background:rgba(127,127,127,.12);border-radius:999px;padding:5px;width:fit-content;max-width:100%;margin:4px 0}
@media(max-width:640px){.seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:0 0 auto}}
@media(max-width:640px){.btn.small{padding:10px 16px;font-size:14px}}
.order-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.order-grid{grid-template-columns:1fr 1fr}}
.order-grid .admin-card{margin:0}
@media(max-width:640px){
  .table.resp tr:first-child{display:none}
  .table.resp, .table.resp tbody, .table.resp tr, .table.resp td{display:block;width:100%}
  .table.resp tr{border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px;background:var(--card)}
  .table.resp td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:right;overflow-wrap:anywhere}
  .table.resp td::before{content:attr(data-label);color:var(--sub);text-align:left;flex:0 0 auto}
}
.table-card{padding:0;overflow:hidden}
@media(max-width:640px){.table-card{padding:12px;overflow:visible}}
.seg button{border:0;padding:9px 16px;border-radius:999px;background:transparent;cursor:pointer;color:var(--text);font-size:14px;font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.admin-layout{display:flex;gap:16px;align-items:flex-start}
.admin-side{position:sticky;top:16px;width:220px;flex:0 0 220px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.admin-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.admin-nav{display:flex;flex-direction:column;gap:6px}
.admin-nav button{border:0;background:transparent;color:var(--text);text-align:left;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.admin-nav button.on{background:var(--text);color:var(--bg)}
.admin-side-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.admin-main{flex:1;min-width:0}
.admin-topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.admin-burger{display:none;border:0;background:rgba(127,127,127,.14);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;color:var(--text)}
.admin-backdrop{display:none}
.admin-side-close{display:none;border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--sub)}
@media(max-width:860px){
  .admin-layout{display:block}
  .admin-side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:260px;max-width:80vw;border-radius:0;transform:translateX(-110%);transition:transform .25s;overflow-y:auto}
  .admin-layout.side-open .admin-side{transform:none}
  .admin-layout.side-open .admin-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .admin-burger{display:block}
  .admin-side-close{display:block}
}
.admin-group-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 4px;user-select:none}
.admin-group-chev{transition:transform .2s;display:inline-block;color:var(--sub)}
.admin-group.collapsed .admin-group-body{display:none}
.admin-group.collapsed .admin-group-chev{transform:rotate(-90deg)}
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.order-card{padding:16px}
.spill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600}
.spill.orange{background:rgba(255,159,10,.16);color:var(--orange)}
.spill.blue{background:rgba(10,132,255,.16);color:var(--accent)}
.spill.purple{background:rgba(88,86,214,.18);color:#7d7aff}
.spill.red{background:rgba(255,69,58,.14);color:var(--red)}
.spill.green{background:rgba(52,199,89,.16);color:var(--green)}
.spill.gray{background:rgba(127,127,127,.18);color:var(--sub)}
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.prod-grid{grid-template-columns:1fr 1fr}}
.admin-card.prod-card{margin:0;padding:12px;box-shadow:none}
.prod-card b{font-size:16px;font-weight:700}
.prod-card .muted{font-size:12px}
.prod-card .price{font-size:24px}
.prod-emoji{font-size:56px}
.prod-img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:16px;display:block}
.prod-img.prod-emoji{display:flex;align-items:center;justify-content:center;font-size:56px}
.detail-img-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#fff}
@media(max-width:720px){.detail-img-photo{position:static;height:auto;aspect-ratio:1/1}}

.btn.danger{background:rgba(255,69,58,.12);color:var(--red)}

<body>
<header class="top"><div class="top-in"><a class="logo" href="#/"><span id="siteName">智选</span></a><nav class="nav"><a class="nav-icon" href="#/" title="商城" aria-label="商城">🛍️</a><a class="nav-icon" href="#/query" title="查询订单" aria-label="查询订单">🔍</a><button id="themeBtn" class="theme-btn" onclick="toggleTheme()" title="切换深浅色">🌙</button></nav></div></header>
<main class="wrap"><div id="announce" class="glass muted" style="margin-bottom:14px"></div><div id="app"></div><div class="footer muted">虚拟商品一经交付不退换，下单前请仔细阅读商品说明。</div></main>
<script>
var CFG = null;
var PRODUCTS = [];
var curStock = 'all';
var curSort = 'featured';
var curQ = '';
function currentTheme(){ if (document.documentElement.dataset.theme) return document.documentElement.dataset.theme; return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
function renderThemeBtn(){ var b = el('themeBtn'); if (b) b.textContent = currentTheme() === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(){ var next = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('theme', next); } catch (e) {} renderThemeBtn(); }
renderThemeBtn();
function el(id){ return document.getElementById(id); }
function escH(s){ var t = String(s == null ? '' : s); return t.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;'); }
function api(p, m, b){ return fetch(p, { method: m || 'GET', headers: {'content-type': 'application/json'}, body: b ? JSON.stringify(b) : undefined }).then(function(r){ return r.json(); }); }
function copyText(t){ if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){ alert('已复制'); }); } else { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('已复制'); } }
function catLabel(c){ if (c === 'recharge') return '代充'; if (c === 'account') return '成品号'; if (c === 'card') return '卡密'; return c; }
function statusLabel(s){ if (s === 'pending_payment') return '待付款'; if (s === 'pending_fulfill') return '待发货'; if (s === 'pending_activation') return '激活待处理'; if (s === 'pending_upstream') return '待处理'; if (s === 'completed') return '已完成'; if (s === 'cancelled') return '已取消'; return s; }
function fmtCountdown(exp){ if (!exp) return ''; var diff = Math.max(0, new Date(String(exp).replace(' ', 'T') + 'Z').getTime() - Date.now()); var m = Math.floor(diff / 60000); var s = Math.floor((diff % 60000) / 1000); return m + '分' + (s < 10 ? '0' : '') + s + '秒'; }
function cnyRate(){ var r = CFG && CFG.cny_rate ? Number(CFG.cny_rate) : 7.2; return (isFinite(r) && r > 0) ? r : 7.2; }
function fmtCNY(usdt){ return '¥' + (Number(usdt || 0) * cnyRate()).toFixed(2); }
function fmtPrice(usdt){ return fmtCNY(usdt) + ' <span class="muted" style="font-size:13px">约 ' + Number(usdt || 0).toFixed(2) + ' USDT</span>'; }
function productThumb(p){
  if (p && p.image_data && String(p.image_data).indexOf('data:image/') === 0) return '<img src="' + escH(p.image_data) + '" class="prod-img" alt="">';
  return '<div class="prod-img prod-emoji">' + escH((p && p.image_emoji) || '🤖') + '</div>';
}
async function load(){ var r = await api('/api/config'); if (r.ok) CFG = r.config; var pr = await api('/api/products'); if (pr.ok) PRODUCTS = pr.products; if (CFG) { el('siteName').textContent = CFG.site_name; el('announce').textContent = CFG.announcement || ''; } route(); }
function route(){ var h = location.hash || '#/'; if (h.indexOf('#/product/') === 0) { renderProduct(h.split('/')[2]); } else if (h.indexOf('#/success/') === 0) { renderSuccess(h.split('/')[2]); } else if (h === '#/query') { renderQuery(); } else if (h === '#/admin') { renderAdmin(); } else { renderShop(); } }
window.addEventListener('hashchange', route);
function renderShop(){
  curQ = '';
  var html = '<div class="h1">选购你的虚拟商品</div><div class="muted">下单后按页面收款地址付精确金额，付完成功后自动发货。</div>';

  html += '<div class="filter-row"><div class="tabs" style="margin:0"><button id="pill-all" onclick="filterStock(\x27all\x27)">全部 <span id="cntAll"></span></button><button id="pill-instock" onclick="filterStock(\x27instock\x27)"><span class="stock-dot"></span> 有货 <span id="cntStock"></span></button></div><div class="muted" id="prodCount"></div></div><div id="list" class="grid shop-grid"></div>';

function filterStock(s){ curStock = s; renderList(); }
function doSearch(){ curQ = el('q').value || ''; renderList(); }
function changeSort(v){ curSort = v; renderList(); }
function productCard(p){
  var inSt = Number(p.in_stock == null ? 1 : p.in_stock);
  var img = (p.image_data && String(p.image_data).indexOf('data:image/') === 0) ? '<img src="' + escH(p.image_data) + '" alt="">' : '<div class="emoji">' + escH(p.image_emoji || '🤖') + '</div>';
  var stock = inSt ? '<span class="stock-dot">有存货</span>' : '<span class="stock-dot out">缺货</span>';
  var btn = inSt ? '<button class="pcard-btn" onclick="event.stopPropagation();location.hash=\x27#/product/' + p.id + '\x27">立即购买 +</button>' : '<button class="pcard-btn" disabled>售罄</button>';
  return '<div class="glass card pcard" data-pid="' + p.id + '" onclick="location.hash=\x27#/product/' + p.id + '\x27"><div class="pcard-img">' + img + '<span class="pcard-arrow">↗</span></div><div class="pcard-meta">' + stock + '<span class="muted pcard-cat">数字产品</span></div><div class="pcard-title">' + escH(p.title) + '</div><div class="pcard-desc">' + escH(p.description || '') + '</div><div class="pcard-foot"><div><div class="pcard-price-label">您的价格</div><div class="pcard-price">' + fmtCNY(p.price_usdt) + '</div></div>' + btn + '</div></div>';
}
function renderList(){
  var list = PRODUCTS.filter(function(p){
    if (curStock === 'instock' && Number(p.in_stock == null ? 1 : p.in_stock) !== 1) return false;
    if (curQ && p.title.indexOf(curQ) === -1) return false;
    return true;
  });
  if (curSort === 'price-asc') list.sort(function(a, b){ return Number(a.price_usdt || 0) - Number(b.price_usdt || 0); });
  else if (curSort === 'price-desc') list.sort(function(a, b){ return Number(b.price_usdt || 0) - Number(a.price_usdt || 0); });
  else if (curSort === 'name-asc') list.sort(function(a, b){ return String(a.title || '').localeCompare(String(b.title || ''), 'zh-CN'); });
  var h = '';
  if (!list.length) h = '<div class="muted">暂无商品</div>';
  for (var i = 0; i < list.length; i++){ h += productCard(list[i]); }
  el('list').innerHTML = h;
  var allBtn = el('pill-all'), stBtn = el('pill-instock');
  if (allBtn) allBtn.className = curStock === 'all' ? 'on' : '';
  if (stBtn) stBtn.className = curStock === 'instock' ? 'on' : '';
  var cA = el('cntAll'), cS = el('cntStock');
  if (cA) cA.textContent = PRODUCTS.length;
  if (cS) cS.textContent = PRODUCTS.filter(function(p){ return Number(p.in_stock == null ? 1 : p.in_stock) === 1; }).length;
  var pc = el('prodCount');
  if (pc) pc.textContent = list.length + ' 种产品';
}

function selectPayOption(btn){ var all = document.querySelectorAll('#payOptions .pay-opt'); for (var i=0;i<all.length;i++) all[i].classList.remove('on'); btn.classList.add('on'); window._payMethod = btn.getAttribute('data-pm'); window._payChain = btn.getAttribute('data-pc'); }
function changeQty(d){ var q = el('qty'); if (!q) return; var v = parseInt(q.value||'1',10) + d; if (v < 1) v = 1; if (v > 99) v = 99; q.value = v; updateTotal(); }
function updateTotal(){ var p = window._curProduct; if (!p) return; var qty = parseInt(el('qty').value||'1',10); if (!qty || qty < 1) qty = 1; if (qty > 99) qty = 99; var totalUsdt = Number(p.price_usdt||0) * qty; var t1 = el('totalPrice'); if (t1) t1.textContent = fmtCNY(totalUsdt); var t2 = el('totalUsdt'); if (t2) t2.textContent = '约 ' + totalUsdt.toFixed(2) + ' USDT'; var st = el('stickyTotal'); if (st) st.innerHTML = fmtCNY(totalUsdt); var sq = el('stickyQty'); if (sq) sq.textContent = qty; }
async function loadCaptcha(){
  var img = el('captchaImg'); if (!img) return;
  try {
    var r = await api('/api/captcha');
    if (r.ok){ window._captchaId = r.captcha_id; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.svg); var cc = el('captchaCode'); if (cc) cc.value = ''; }
  } catch (e) {}
}
async function submitOrder(pid){
  var qty = parseInt(el('qty').value || '1', 10);
  var capCode = el('captchaCode') ? el('captchaCode').value.trim() : '';
  if (!capCode){ alert('请填写图形验证码'); loadCaptcha(); return; }
  var cust = {}; var ins = document.querySelectorAll('[data-k]');
  for (var i = 0; i < ins.length; i++) cust[ins[i].getAttribute('data-k')] = ins[i].value;
  var p = window._curProduct || {};
  var activationEmail = el('activation_email') ? el('activation_email').value.trim() : '';
  var activationConfirm = el('activation_email_confirm') ? el('activation_email_confirm').value.trim() : '';
  if (p.requires_email_activation){
    if (!activationEmail){ alert('请填写激活邮箱'); return; }
    if (activationEmail !== activationConfirm){ alert('两次激活邮箱不一致'); return; }
    if (!el('activation_confirm').checked){ alert('请勾选确认激活邮箱无误'); return; }
    if (!confirm('再次确认：激活邮箱 ' + activationEmail + ' 是要开通会员的邮箱，填错无法开通。确认无误？')) return;
  }
  cust.activation_email = activationEmail; cust.activation_email_confirm = activationConfirm;
  var r = await api('/api/orders', 'POST', { product_id: Number(pid), quantity: qty, customer_fields: cust, contact: el('contact').value, pay_method: window._payMethod || (el('payMethod') ? el('payMethod').value : 'Binance'), pay_chain: window._payChain || (el('payChain') ? el('payChain').value : 'X Layer'), captcha_id: window._captchaId || '', captcha_code: capCode });
  if (!r.ok){ alert(r.error || '下单失败'); if ((r.error || '').indexOf('验证码') !== -1) loadCaptcha(); return; }
  sessionStorage.setItem('lastOrder', JSON.stringify(r.order));
  location.hash = '#/success/' + r.order.order_no;
}

  var tut = ''; if (CFG && o) tut = CFG.pay_tutorials[o.pay_method] || '';

  html += '<p>收款地址：</p><div class="codebox" id="addrBox">' + escH(addr) + '</div><button class="btn small" style="margin-top:8px" onclick="copyText(document.getElementById(\'addrBox\').textContent)">复制地址</button><div style="margin:12px 0"><img src="' + qr + '" width="180" height="180" alt="收款二维码"></div>';
  html += '<p>剩余支付时间：<b id="countdown">' + fmtCountdown(o ? o.expires_at : '') + '</b>（20 分钟锁定，超时订单自动取消）</p>';
  html += '<p class="muted">付完不用做任何事，等 1-3 分钟自动发货。系统按精确金额自动匹配到账，金额差 1 分钱都匹配不上。</p>';
  html += '<p class="muted">教程：<a href="' + escH(tut) + '" target="_blank">支付教程</a></p>';
  html += '<label>TXID（可选兜底：自动发货未到账时再提交，币安 UID 站内转账填订单 ID）</label><input id="txid" placeholder="粘贴交易哈希（可选）"><div style="margin-top:10px"><button class="btn" data-no="' + escH(no) + '" onclick="submitTxid(this.dataset.no)">提交 TXID（可选）</button> <a class="btn ghost" href="#/query">去查询订单</a></div></div>';
  el('app').innerHTML = html;
  if (o && o.expires_at) { clearInterval(window._cdTimer); window._cdTimer = setInterval(function(){ var c = el('countdown'); if (!c){ clearInterval(window._cdTimer); return; } c.textContent = fmtCountdown(o.expires_at); }, 1000); }
}
async function submitTxid(no){
  var txEl = el('txid') || el('qtxid-' + no) || el('qtxid');
  var tx = txEl ? txEl.value : '';
  var r = await api('/api/orders/' + encodeURIComponent(no) + '/pay', 'POST', { txid: tx });
  if (!r.ok){ alert(r.error); return; }
  alert(r.message || 'TXID 已提交');
}

  var html = '<div class="glass"><div class="h2">查询订单</div><p class="muted">邮箱地址和订单编号任填其一</p><label>邮箱地址</label><input id="qemail" placeholder="下单时填写的邮箱"><label>订单编号</label><input id="qno" placeholder="AIS…"><div style="margin-top:12px"><button class="btn" onclick="doQuery()">查询</button></div><div id="qres" style="margin-top:14px"></div></div>';

function renderQueryOrderDetail(o){
  var snap = o.product_snapshot || {};

  if (o.data_expired) { h += '<p class="muted">交付数据已超过 7 天自动清空</p>'; }
  else if (o.delivery_content) { var delId = 'delBox-' + escH(o.order_no); h += '<p>交付内容：</p><div class="codebox" id="' + delId + '">' + escH(o.delivery_content) + '</div><button class="btn small" style="margin-top:8px" onclick="copyText(document.getElementById(\x27' + delId + '\x27).textContent)">复制交付内容</button>'; }
  else { h += '<p class="muted">暂无交付内容，付款后等待 1-3 分钟自动发货（已付但未到账请检查金额与地址是否精确一致）</p>'; }
  if (o.status === 'pending_activation'){ h += '<p class=\'muted\'>已付款，正在等待激活返回交付内容，请不要重复下单。</p>'; }
  if (o.status === 'pending_upstream'){ h += '<p class=\'muted\'>暂不可发货，已转人工处理，请联系客服。</p>'; }
  if (o.status === 'pending_payment'){ h += '<p class=\'muted\'>精确应付：' + fmtCNY(o.actual_amount || o.total_usdt) + '（实际按 ' + (o.actual_amount || o.total_usdt) + ' USDT 付款） · 剩余：' + fmtCountdown(o.expires_at) + ' · 付完不用做任何事，等 1-3 分钟自动发货</p><label>提交 TXID（可选兜底）</label><input id="qtxid-' + escH(o.order_no) + '" placeholder="粘贴交易哈希"><div style="margin-top:8px"><button class="btn small" data-no="' + escH(o.order_no) + '" onclick="submitTxid(this.dataset.no)">提交 TXID</button></div>'; }

async function doQuery(){
  var email = el('qemail').value.trim();
  var no = el('qno').value.trim();
  if (no) {
    var r = await api('/api/orders/' + encodeURIComponent(no));
    if (!r.ok){ el('qres').innerHTML = '<div class="muted">' + escH(r.error) + '</div>'; return; }
    el('qres').innerHTML = renderQueryOrderDetail(r.order);
  } else if (email) {
    var r2 = await api('/api/orders?contact=' + encodeURIComponent(email));
    if (!r2.ok){ el('qres').innerHTML = '<div class="muted">' + escH(r2.error) + '</div>'; return; }
    var list = r2.orders || [];
    if (!list.length){ el('qres').innerHTML = '<div class="muted">该邮箱下没有订单</div>'; return; }
    window._queryOrders = list;
    var h = '<div class="muted">共 ' + list.length + ' 笔订单</div>';
    for (var i = 0; i < list.length; i++){ var oo = list[i]; var ss = oo.product_snapshot || {}; h += '<div class="glass" style="margin-top:10px"><p><b>' + escH(ss.title || '') + '</b> · ' + statusLabel(oo.status) + ' · ' + fmtPrice(oo.total_usdt) + '</p><p class="muted">' + escH(oo.order_no) + ' · ' + escH(oo.created_at || '') + '</p><div style="margin-top:8px"><button class="btn small" data-no="' + escH(oo.order_no) + '" onclick="showQueryOrder(this.dataset.no)">查看交付内容</button></div><div id="qord-' + escH(oo.order_no) + '" style="margin-top:10px"></div></div>'; }
    el('qres').innerHTML = h;
  } else {
    alert('请填写邮箱地址或订单编号');
  }
}
function showQueryOrder(no){
  var list = window._queryOrders || [];
  for (var i = 0; i < list.length; i++){ if (list[i].order_no === no){ var box = document.getElementById('qord-' + no); if (box) box.innerHTML = renderQueryOrderDetail(list[i]); return; } }
}

function handleProductImage(file, pfx){

  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var side = Math.min(img.width, img.height);
      var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      var cv = document.createElement('canvas'); cv.width = 800; cv.height = 800;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, 800, 800);
      var url = cv.toDataURL('image/jpeg', 0.82);
      if (url.length > 700000) url = cv.toDataURL('image/jpeg', 0.6);
      if (url.length > 700000){ alert('图片压缩后仍超过 500KB，请换一张更小的图'); return; }
      window._productImage = window._productImage || {};
      window._productImage[pfx] = url;
      var pv = el(pfx + 'imgpv');
      if (pv) pv.innerHTML = '<img src="' + url + '" style="width:120px;height:120px;object-fit:cover;border-radius:16px">';
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function clearProductImage(pfx){
  window._productImage = window._productImage || {};
  window._productImage[pfx] = '';
  var pv = el(pfx + 'imgpv');
  if (pv) pv.innerHTML = '<div class="muted">已移除，保存后显示默认图标</div>';
}
function adminEditProduct(id){
  var box = el('edit-' + id); if (!box) return;
  if (box.style.display !== 'none'){ box.style.display = 'none'; box.innerHTML = ''; return; }
  var p = null; for (var i = 0; i < (window._adminProducts || []).length; i++){ if (String(window._adminProducts[i].id) === String(id)) p = window._adminProducts[i]; }
  if (!p) return;
  box.style.display = 'block';
  box.innerHTML = productFormHTML('ep' + id + '-', p) + '<div class="row" style="margin-top:12px"><button class="btn small" data-id="' + id + '" onclick="adminSaveProduct(this.dataset.id)">保存</button> <button class="btn small ghost" data-id="' + id + '" onclick="adminEditProduct(this.dataset.id)">收起</button></div>';
}
async function adminSaveProduct(id){
  var pfx = id ? 'ep' + id + '-' : 'np-';
  var slugVal = (el(pfx + 'slug').value || '').trim().toLowerCase().replace(/[^a-z0-9\-]+/g, '-').replace(/^-+|-+$/g, '');
  if (!slugVal) slugVal = 'p-' + Date.now().toString(36);
  var body = { slug: slugVal, title: el(pfx + 'title').value, price_usdt: parseFloat(el(pfx + 'price').value || '0'), sell_price: parseFloat(el(pfx + 'price').value || '0'), cost_price: parseFloat(el(pfx + 'cost').value || '0'), source: el(pfx + 'source').value, prodseller_id: el(pfx + 'psid').value, requires_email_activation: el(pfx + 'reqact').checked ? 1 : 0, delivery_method: 'both', category: el(pfx + 'cat').value, stock_type: el(pfx + 'stock').value, description: el(pfx + 'desc').value, notice: el(pfx + 'notice').value, image_emoji: '🤖', is_active: Number(el(pfx + 'active').value), in_stock: Number(el(pfx + 'instock').value) };
  if (id){
    var old = null; for (var i = 0; i < (window._adminProducts || []).length; i++){ if (String(window._adminProducts[i].id) === String(id)) old = window._adminProducts[i]; }
    body.image_emoji = (old && old.image_emoji) || '🤖';
    if (window._productImage && (pfx in window._productImage)) body.image_data = window._productImage[pfx];
    var ff = [{ key: 'contact', label: '联系方式（邮箱/TG）', required: true, placeholder: '' }];
    if (old && old.form_fields != null){ if (typeof old.form_fields === 'string'){ try { ff = JSON.parse(old.form_fields); } catch (e) { ff = ff; } } else { ff = old.form_fields; } }
    body.form_fields = ff;
    var r = await api('/api/admin/products/' + id, 'PUT', body);
  } else {
    body.form_fields = [{ key: 'contact', label: '联系方式（邮箱/TG）', required: true, placeholder: '' }];
    if (window._productImage && (pfx in window._productImage)) body.image_data = window._productImage[pfx];
    var r = await api('/api/admin/products', 'POST', body);
  }
  if (!r.ok){ alert(r.error); return; }
  if (window._productImage) delete window._productImage[pfx];
  adminTab('products');
}
async function adminDelProduct(id){ if (!confirm('确认删除？订单快照不受影响')) return; await api('/api/admin/products/' + id, 'DELETE'); adminTab('products'); }
async function adminImportCards(){ var r = await api('/api/admin/cards/import', 'POST', { product_id: parseInt(el('ci-pid').value || '0', 10), codes: el('ci-codes').value }); if (!r.ok){ alert(r.error); return; } alert('导入 ' + r.imported + ' 条'); adminTab('cards'); }
async function adminDelCard(id){ if (!confirm('确认删除该卡密？')) return; await api('/api/admin/cards/' + id, 'DELETE'); adminTab('cards'); }
async function adminSaveSettings(){ var obj = {}; var tas = document.querySelectorAll('[data-sk]'); for (var i = 0; i < tas.length; i++) obj[tas[i].getAttribute('data-sk')] = tas[i].value; var r = await api('/api/admin/settings', 'POST', { settings: obj }); if (!r.ok){ alert(r.error); return; } alert('已保存'); }
async function adminUpstreamSync(){ var r = await api('/api/admin/upstream/sync', 'POST', {}); if (!r.ok){ alert(r.error); return; } el('upRes').textContent = '同步成功 ' + r.count + ' 件，fetched_at ' + r.fetched_at; }
async function adminUpstreamBalance(){ var r = await api('/api/admin/upstream/balance'); if (!r.ok){ alert(r.error); return; } el('upRes').textContent = '余额：' + JSON.stringify(r.balance); }
async function adminUpstreamImport(){ var ids = (el('up-ids').value || '').split(',').map(function(s){ return { id: s.trim() }; }).filter(function(x){ return x.id; }); if (!ids.length){ alert('请填写上游商品 ID'); return; } var r = await api('/api/admin/upstream/import', 'POST', { items: ids }); if (!r.ok){ alert(r.error); return; } alert('导入 ' + r.imported + ' 件（markup ' + r.markup + ' / fixed ' + r.fixed + '）'); adminTab('products'); }

load();
</script>
